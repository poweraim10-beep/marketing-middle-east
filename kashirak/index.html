<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B1F3A">
<meta name="description" content="كاشيرك الذكي: كاشير ومحاسبة ودفتر ديون للمحلات، يشتغل بدون إنترنت.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>كاشيرك الذكي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: phone-width column; navy header with a gold rule, ivory body, floating gold sell button in the bottom bar. */
:root{
  --bg:#F4F2EC; --surface:#FFFFFF; --ink:#0B1F3A; --muted:#5E6A7E; --line:#E3DED2;
  --brand:#0B1F3A; --brand-ink:#F7F1E1; --gold:#C8A24A; --gold-deep:#9C7A2E; --gold-ink:#0B1F3A;
  --good:#1F7A4D; --warn:#A86A12; --bad:#B3261E;
  --hdr1:#16325A; --hdr2:#0B1F3A;
  --display:"Readex Pro","IBM Plex Sans Arabic","Noto Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic","Noto Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --shadow:0 1px 2px rgba(11,31,58,.06),0 6px 18px rgba(11,31,58,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#08111F; --surface:#101C30; --ink:#EEF1F7; --muted:#9AA8BF; --line:#22314B;
    --brand:#E0BD6A; --brand-ink:#0B1F3A; --gold:#E0BD6A; --gold-deep:#E0BD6A; --gold-ink:#0B1F3A;
    --good:#5BC28E; --warn:#E3B341; --bad:#F2837B; --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#08111F; --surface:#101C30; --ink:#EEF1F7; --muted:#9AA8BF; --line:#22314B;
  --brand:#E0BD6A; --brand-ink:#0B1F3A; --gold:#E0BD6A; --gold-deep:#E0BD6A; --gold-ink:#0B1F3A;
  --good:#5BC28E; --warn:#E3B341; --bad:#F2837B; --shadow:none;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}
header{background:linear-gradient(135deg,var(--hdr1),var(--hdr2));color:#F7F1E1;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:2px solid #C8A24A;padding-top:max(12px,env(safe-area-inset-top))}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:38px;height:38px;flex:none}
header h1{font-family:var(--display);font-size:18px;margin:0;font-weight:700;letter-spacing:.2px}
header h1 b{color:#E6C878;font-weight:700}
header .sub{font-size:12px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.modebtn{background:rgba(255,255,255,.08);color:#F7F1E1;border:1px solid rgba(230,200,120,.6);border-radius:999px;padding:5px 12px;font-size:12px;cursor:pointer;white-space:nowrap}
main{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px}
nav{display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{background:none;border:0;padding:8px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);cursor:pointer}
nav button svg{width:22px;height:22px}
nav button[aria-current="page"]{color:var(--gold-deep);font-weight:600}
nav button.sell-tab span.ic{background:linear-gradient(180deg,#E6C878,#C39A3E);color:#0B1F3A;border-radius:16px;padding:7px 16px;margin-top:-22px;box-shadow:0 4px 12px rgba(155,120,40,.35);display:flex;border:3px solid var(--surface)}
h2{font-family:var(--display);font-size:16px;margin:0;text-wrap:balance;font-weight:700}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
.muted{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:var(--shadow)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;text-align:start;box-shadow:var(--shadow)}
button.tile{cursor:pointer}
.tile .lbl{font-size:12.5px;color:var(--muted)}
.tile .val{font-size:21px;font-weight:700}
.tile.hl{background:linear-gradient(135deg,#16325A,#0B1F3A);color:#F7F1E1;border-color:transparent;position:relative;overflow:hidden}
.tile.hl::after{content:"";position:absolute;inset:auto -30px -30px auto;width:90px;height:90px;border-radius:50%;border:2px solid rgba(230,200,120,.25)}
.tile.hl .lbl{color:inherit;opacity:.8}
.tile.hl .val{color:#E6C878}
.banner{border-radius:14px;padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid}
.banner.trial{background:color-mix(in srgb,var(--gold) 12%,var(--surface));border-color:color-mix(in srgb,var(--gold) 45%,transparent)}
.banner.over{background:color-mix(in srgb,var(--bad) 10%,var(--surface));border-color:color-mix(in srgb,var(--bad) 40%,transparent)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.list{display:flex;flex-direction:column}
.list>.li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);background:none;border-inline:0;border-top:0;text-align:start;width:100%}
.list>button.li{cursor:pointer}
.list>.li:last-child{border-bottom:0}
.li .t{font-weight:600;overflow-wrap:anywhere}
.pill{font-size:11.5px;border-radius:999px;padding:1px 9px;white-space:nowrap;font-weight:600}
.pill.ok{color:var(--good);background:color-mix(in srgb,var(--good) 14%,transparent)}
.pill.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 16%,transparent)}
.pill.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:600;min-height:44px;text-align:center}
a.btn{text-decoration:none;color:var(--ink);display:flex;align-items:center;justify-content:center;gap:6px}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.btn.accent{background:linear-gradient(180deg,#E6C878,#C39A3E);color:#0B1F3A;border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.block{width:100%;display:block}
.btn.sm{min-height:34px;padding:4px 10px;font-size:13px;border-radius:10px;white-space:nowrap}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input,select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-height:44px}
input[type=checkbox]{width:22px;min-height:22px;height:22px;padding:0;accent-color:var(--gold-deep)}
label{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:4px}
label.chk{flex-direction:row;align-items:center;gap:8px;color:var(--ink);font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{white-space:nowrap;flex:1;border:0;background:none;border-radius:9px;padding:8px 4px;cursor:pointer;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);font-weight:600}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-size:18px;line-height:1}
.cartline{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.cartline:last-child{border-bottom:0}
.total{font-size:26px;font-weight:700}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end;height:130px}
.bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:3px;font-size:10.5px;color:var(--muted)}
.bar i{display:block;width:100%;background:color-mix(in srgb,var(--ink) 18%,transparent);border-radius:6px 6px 2px 2px;min-height:3px}
.trk{flex:1;width:100%;display:flex;align-items:flex-end;min-height:0}
.bar.today i{background:linear-gradient(180deg,#E6C878,#C39A3E)}
.hbar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.hbar i{display:block;height:100%;background:linear-gradient(90deg,#C39A3E,#E6C878);border-radius:99px}
.sheet{position:fixed;inset:0;background:rgba(6,14,28,.6);display:none;align-items:flex-end;justify-content:center;z-index:10}
.sheet.open{display:flex}
#scanSheet{z-index:15}
.sheet .box{background:var(--bg);width:100%;max-width:520px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;border-top:3px solid var(--gold)}
.toast{position:fixed;bottom:88px;left:50%;transform:translateX(-50%);background:#0B1F3A;color:#F7F1E1;border:1px solid #C8A24A;padding:8px 16px;border-radius:999px;font-size:13.5px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20;max-width:90%;text-align:center}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
.empty{text-align:center;color:var(--muted);padding:18px 0}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu button{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:start;cursor:pointer;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow);border-top:3px solid var(--gold)}
.menu b{font-family:var(--display);font-size:15px}
.label{background:#fff;color:#000;border-radius:10px;padding:10px;text-align:center;border:1px dashed var(--line)}
.label svg{max-width:100%;height:auto}
video{width:100%;border-radius:12px;background:#000;max-height:260px;object-fit:cover}
.withbtn{display:flex;gap:8px;align-items:flex-end}
.withbtn label{flex:1}
.setup{min-height:100%;display:flex;flex-direction:column;gap:16px;padding:24px 18px;max-width:520px;margin:0 auto}
.hero{background:linear-gradient(150deg,#16325A,#0B1F3A);color:#F7F1E1;border-radius:22px;padding:26px 20px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;border-bottom:3px solid #C8A24A}
.hero svg{width:84px;height:84px}
.hero h1{font-family:var(--display);margin:0;font-size:26px}
.hero h1 b{color:#E6C878}
.hero p{margin:0;opacity:.85;font-size:14px}
.code{font-family:var(--display);letter-spacing:2px;direction:ltr;font-size:18px;text-align:center}
#live{position:relative;margin:12px 16px 0;border-radius:18px;overflow:hidden;background:#06101F;height:200px;border:2px solid var(--gold);flex:none}
#live video{width:100%;height:100%;object-fit:cover;display:block;max-height:none;border-radius:0}
#live .aim{position:absolute;inset:22px 34px 46px;border:2px solid rgba(230,200,120,.85);border-radius:14px;pointer-events:none;box-shadow:0 0 0 999px rgba(6,16,31,.28)}
#live .aim i{position:absolute;left:6%;right:6%;top:50%;height:2px;background:#FF4D4D;box-shadow:0 0 10px #FF4D4D;animation:sweep 1.6s ease-in-out infinite alternate}
@keyframes sweep{from{top:12%}to{top:88%}}
@media (prefers-reduced-motion: reduce){#live .aim i{animation:none}}
#live .livebar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;background:linear-gradient(0deg,rgba(6,16,31,.9),rgba(6,16,31,0));color:#F7F1E1;font-size:12.5px}
#live .livebar .btn{background:rgba(255,255,255,.12);color:#F7F1E1;border-color:rgba(230,200,120,.6)}
#liveFlash{position:absolute;top:10px;left:50%;transform:translateX(-50%);padding:6px 14px;border-radius:999px;font-weight:700;font-size:14px;opacity:0;transition:opacity .15s;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
#liveFlash.show{opacity:1}
#liveFlash.ok{background:#1F7A4D;color:#fff}
#liveFlash.bad{background:#B3261E;color:#fff}
#live.off{height:auto;background:var(--surface)}
#live.off video,#live.off .aim,#live.off #liveFlash{display:none}
#live.off .livebar{position:static;background:none;color:var(--ink);padding:8px 12px}
#live.off .livebar .btn{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.mgroup{display:flex;flex-direction:column;gap:8px}
.mgroup h3{font-family:var(--display);font-size:13px;color:var(--muted);margin:4px 2px 0;font-weight:600}
.menu button{border-top:1px solid var(--line)!important}
.mic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--gold) 16%,transparent);color:var(--gold-deep);margin-bottom:6px}
.mic svg{width:22px;height:22px}
.mic.big{width:52px;height:52px;border-radius:16px;background:linear-gradient(180deg,#E6C878,#C39A3E);color:#0B1F3A;margin:0;flex:none}
.mic.big svg{width:28px;height:28px}
.pdfhero{display:flex;align-items:center;gap:14px;width:100%;border:0;border-radius:18px;padding:16px;cursor:pointer;background:linear-gradient(135deg,#16325A,#0B1F3A);color:#F7F1E1;border-bottom:3px solid #C8A24A;font:inherit;text-align:start}
.pdfhero b{font-family:var(--display);font-size:17px;color:#E6C878}
.pdfhero span span{font-size:13px;opacity:.85}
.pdfhero .chev{font-size:26px;color:#E6C878;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;cursor:pointer;font-size:14px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:transparent;font-weight:600}
.checks{display:flex;flex-direction:column;gap:8px}
.card2{border:1px solid var(--line);border-radius:12px;padding:10px 12px;align-items:flex-start!important;cursor:pointer}
.card2:has(input:checked){border-color:var(--gold);background:color-mix(in srgb,var(--gold) 8%,var(--surface))}
.card2 input{margin-top:2px;flex:none}
#printArea{display:none}
@media print{
  @page{size:58mm auto;margin:0}
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{display:block;position:absolute;inset:0 auto auto 0;width:58mm}
  #printArea img{width:58mm;display:block}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><span id="hdrLogo"></span><div style="min-width:0"><h1>كاشيرك <b>الذكي</b></h1><div class="sub" id="today"></div></div></div>
    <button class="modebtn" id="modeBtn" data-act="mode"></button>
  </header>
  <div id="live" hidden>
    <video id="liveVid" playsinline muted autoplay></video>
    <div class="aim" aria-hidden="true"><i></i></div>
    <div id="liveFlash" aria-live="polite"></div>
    <div class="livebar"><span id="liveMsg">جارٍ تشغيل الكاميرا…</span><button class="btn sm" id="liveToggle" data-act="liveToggle">إيقاف الكاميرا</button></div>
  </div>
  <main id="view"></main>
  <nav id="nav"></nav>
</div>
<div class="sheet" id="sheet"><div class="box" id="sheetBox" role="dialog" aria-modal="true"></div></div>
<div class="sheet" id="scanSheet"><div class="box" id="scanBox" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>
<div id="printArea"></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round((Number(n)+Number.EPSILON)*100)/100;
const r3=n=>Math.round((Number(n)+Number.EPSILON)*1000)/1000;
const fx=n=>r2(n).toFixed(2);
const money=n=>`<span class="num">${fx(n)} ₪</span>`;
const DAY=864e5;
const sod=(t=Date.now())=>new Date(t).setHours(0,0,0,0);
const fdate=t=>new Date(t).toLocaleString('ar-u-nu-latn',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const KEY='kashirak-v1', DEVKEY='kashirak-dev';
const PAY={cash:'نقدي',app:'تطبيق أو محفظة',debt:'دين'};
const APPM=['بنك فلسطين','PalPay','جوال باي','بنك آخر'];
const payOf=s=>s.pays||{cash:s.pay==='cash'?s.total:0,app:s.pay==='bank'?s.total:0,debt:s.pay==='debt'?s.total:0};
const payLabel=s=>{const p=payOf(s),k=Object.keys(PAY).filter(x=>p[x]>0);return k.length>1?'مقسّم':PAY[k[0]||'cash']};
const isOwner=()=>S.mode!=='cashier';
const newCart=()=>({lines:[],discount:0,pay:'cash',custId:'',custName:'',custPhone:'',payer:'',splitCash:'',splitApp:'',appMethod:APPM[0],ref:''});
const waNum=ph=>{let d=String(ph||'').replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);if(/^05\d{8}$/.test(d))d=(/^05[69]/.test(d)?'970':'972')+d.slice(1);return d};
const ICON={
 home:'<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 sell:'<path d="M3 5h2l2.5 11h10L20 8H7M9 20a1 1 0 1 0 0-.01M17 20a1 1 0 1 0 0-.01"/>',
 items:'<path d="M3 8l9-5 9 5v8l-9 5-9-5zM3 8l9 5 9-5M12 13v8"/>',
 debts:'<path d="M5 3h12a2 2 0 0 1 2 2v16l-4-2-4 2-4-2-2 1zM9 8h6M9 12h6"/>',
 more:'<path d="M4 6h16M4 12h16M4 18h16"/>'
};
const MIC={pdf:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>',chart:'<path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/>',
 list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',truck:'<path d="M3 7h11v9H3zM14 10h4l3 3v3h-7"/><circle cx="7" cy="18" r="1.6"/><circle cx="17" cy="18" r="1.6"/>',
 users:'<circle cx="9" cy="8" r="3.2"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 4.5a3 3 0 0 1 0 6M21 20c0-2.6-1.6-4.8-4-5.6"/>',tag:'<path d="M20 12l-8 8-9-9V3h8z"/><circle cx="7.5" cy="7.5" r="1.3"/>',
 cash:'<rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.6"/><path d="M6 9.5v5M18 9.5v5"/>',wallet:'<path d="M3 7a2 2 0 0 1 2-2h12v4M3 7v10a2 2 0 0 0 2 2h15V9H5a2 2 0 0 1-2-2z"/><path d="M16 14h.01"/>',

    ${c.pay==='app'||c.pay==='split'?`<div class="grid2"><label for="apM">جهة التحويل<select id="apM" class="cf" data-f="appMethod">${APPM.map(m=>`<option ${c.appMethod===m?'selected':''}>${m}</option>`).join('')}</select></label><label for="apR">رقم العملية<input id="apR" class="cf" data-f="ref" inputmode="numeric" value="${esc(c.ref)}" placeholder="اختياري"></label></div>
    <label for="apP">الدفع باسم مين؟<input id="apP" class="cf" data-f="payer" value="${esc(c.payer)}" placeholder="اسم صاحب الحساب أو المحفظة (اختياري)" autocomplete="off"></label>`:''}
    ${S.loyal.on&&c.pay!=='debt'&&c.pay!=='split'?`<label for="lName">اسم الزبون لجمع النقاط (اختياري)<input id="lName" class="cf" data-f="custName" list="custList" value="${esc(c.custName)}" autocomplete="off" placeholder="اكتب الاسم"></label><datalist id="custList">${S.customers.map(x=>`<option value="${esc(x.name)}">`).join('')}</datalist>`:''}
    ${c.pay==='debt'||c.pay==='split'?`<div class="card" style="box-shadow:none;border-color:color-mix(in srgb,var(--gold) 50%,transparent);gap:8px">
      <div class="row"><b>تفاصيل الدين</b><span id="debtAmt">${money(splitPays(gt,c).debt)}</span></div>
      <label for="dName">اسم الشخص<input id="dName" class="cf" data-f="custName" list="custList" value="${esc(c.custName)}" placeholder="اكتب الاسم أو اختر من الزبائن" autocomplete="off"></label>
      <datalist id="custList">${S.customers.map(x=>`<option value="${esc(x.name)}">`).join('')}</datalist>
      <label for="dPhone">رقم جواله (اختياري)<input id="dPhone" class="cf" data-f="custPhone" inputmode="tel" value="${esc(c.custPhone)}" placeholder="059xxxxxxx"></label>
      <p class="muted" style="margin:0">المبلغ بينضاف مباشرة على حسابه بدفتر الديون.</p></div>`:''}
    ${tt.promo?`<div class="row" style="color:var(--good)"><span>عرض: ${esc(tt.promoTxt.join('، '))}</span><span>${money(-tt.promo)}</span></div>`:''}
    ${fee?`<div class="row muted"><span>رسوم الدفع بالتطبيق ${S.appFee}%</span>${money(fee)}</div>`:''}
    <div class="row"><span class="muted">الإجمالي${tt.disc?` بعد خصم ${fx(tt.disc)} ₪`:''}</span><span class="total">${money(gt)}</span></div>
    <div class="row muted"><span>بالدولار <span class="num">$ ${fx(gt/(S.rate||1))}</span></span><span>بالدينار <span class="num">${fx(gt/(S.rateJ||1))} JD</span></span></div>
    ${c.pay==='cash'?`<div class="withbtn"><label for="rcv">استلمت من الزبون<input id="rcv" class="cf" data-f="rcv" type="number" inputmode="decimal" min="0" value="${esc(c.rcv||'')}" placeholder="المبلغ"></label>
      <select id="rcvC" class="cf" data-f="rcvC" style="width:110px" aria-label="عملة المبلغ المستلم">${[['ils','شيكل'],['usd','دولار'],['jod','دينار']].map(([k,v])=>`<option value="${k}" ${c.rcvC===k?'selected':''}>${v}</option>`).join('')}</select></div>
      <div class="row" id="chg">${changeTxt(gt,c)}</div>`:''}
    <button class="btn accent block" data-act="checkout">إتمام البيع</button>
  </div>`;
},
items(){
  const sold={}; S.sales.filter(s=>s.ts>=sod(Date.now()-29*DAY)).forEach(s=>s.lines.forEach(l=>{sold[l.itemId]=r3((sold[l.itemId]||0)+l.baseQty)}));
  const low=S.items.filter(i=>i.qty<=i.min).length, val=S.items.reduce((a,i)=>a+Math.max(i.qty,0)*i.price,0);
  return `
  <div class="tiles"><div class="tile hl"><div class="lbl">عدد الأصناف</div><div class="val">${S.items.length}</div></div><div class="tile"><div class="lbl">قليلة أو خالصة</div><div class="val" style="color:var(--${low?'warn':'good'})">${low}</div></div></div>
  <div class="grid2"><button class="btn" data-act="priceWa">قائمة الأسعار واتساب</button><button class="btn" data-act="pdfGo" data-sel="prices">قائمة الأسعار PDF</button></div>
  <label for="iq" style="margin:0">بحث بالأصناف<input id="iq" inputmode="search" autocomplete="off" placeholder="اكتب اسم الصنف" value="${esc(iq)}"></label>
  <div class="row"><h2>الأصناف (${S.items.length})</h2>${isOwner()?'<div class="row" style="gap:6px"><button class="btn sm" data-act="importItems">استيراد</button><button class="btn primary sm" data-act="editItem" data-id="0">إضافة صنف</button></div>':''}</div>
  ${S.items.length?'':'<div class="card"><h2>أضف أصناف محلك</h2><p class="muted" style="margin:0">امسح باركود الصنف أو اكتبه، أو استورد قائمة أصناف دفعة وحدة من ملف إكسل محفوظ CSV.</p></div>'}
  <div class="card"><div class="list" id="itemList">${S.items.filter(i=>!iq||i.name.includes(iq)||i.barcode.includes(iq)).map(i=>{
    const st=i.qty<=0?['bad','خلص']:i.qty<=i.min?['warn','قليل']:['ok','متوفر'];
    return `<button class="li" data-act="editItem" data-id="${i.id}">
      <span><span class="t">${esc(i.name)}</span><br><span class="muted">${isOwner()?`تكلفة ${fx(i.cost)} · `:''}بيع ${fx(i.price)} ₪${i.cartonSize>1?` · كرتونة ${i.cartonSize}`:''}${i.barcode?'':' · بدون باركود'}<br>مبيع آخر 30 يوم: <span class="num">${sold[i.id]||0}</span>${isOwner()&&sold[i.id]?` · ربح <span class="num">${fx(sold[i.id]*(i.price-i.cost))}</span> ₪`:''}</span></span>
      <span style="text-align:end"><span class="num" style="font-weight:700">${qtyTxt(i)}</span><br><span class="pill ${st[0]}">${st[1]}</span></span></button>`}).join('')}</div></div>`;
},
debts(){
  const total=r2(S.customers.reduce((a,c)=>a+balance(c),0));
  return `
  <div class="tile hl"><div class="lbl">مجموع الديون على الزبائن</div><div class="val">${money(total)}</div></div>
  <div class="row"><h2>الزبائن</h2><div class="row" style="gap:6px"><button class="btn sm" data-act="debtList">كشف الديون</button><button class="btn primary sm" data-act="addParty" data-kind="customers">إضافة زبون</button></div></div>
  <div class="card"><div class="list">${S.customers.map(c=>{const b=balance(c);return `<button class="li" data-act="party" data-kind="customers" data-id="${c.id}">
    <span class="t">${esc(c.name)}</span><span>${b>0?`${money(b)} <span class="pill warn">عليه</span>`:b<0?`${money(-b)} <span class="pill ok">له رصيد</span>`:'<span class="pill ok">خالص</span>'}</span></button>`}).join('')}</div></div>`;
},
more(){

    const grp=(title,list)=>{const l=list.filter(([k])=>isOwner()||k==='log');return l.length?`<div class="mgroup"><h3>${title}</h3><div class="menu">${l.map(tile).join('')}</div></div>`:''};

    return `${isOwner()?`<button class="pdfhero" data-act="sub" data-s="pdf"><span class="mic big"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${MIC.pdf}</svg></span>

    ${grp('المبيعات والأرباح',[['rep','التقارير','الأرباح والخسائر وتفاصيل الأصناف','chart'],['log','سجل المبيعات','كل الفواتير والمرتجعات','list']])}
    ${grp('البضاعة والموردين',[['buy','المشتريات','استلام بضاعة من مورد','truck'],['sup','الموردين','أرصدتهم ودفعاتهم','users'],['lab','ملصقات الباركود','طباعة ملصقات للأصناف','tag']])}
    ${grp('الفلوس',[['cash','الصندوق','النقد المتوقع وإقفال اليوم','cash'],['exp','المصروفات','إيجار وكهرباء وغيرها','wallet'],['chq','الشيكات','الواردة والصادرة ومواعيدها','list'],['loy','نقاط الولاء','نقاط للزبائن على مشترياتهم','tag']])}
    ${grp('العمال',[['att','بصمة العمال','الدوام والساعات وصور البصمة','users']])}

  }

      <label for="qParty">${CHQ.dir==='in'?'الزبون':'المورد'}<select id="qParty"><option value="">بدون ربط بحساب</option>${S[CHQ.dir==='in'?'customers':'suppliers'].map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></label>

      <div class="grid2"><label for="qAmt">المبلغ (₪)<input id="qAmt" type="number" inputmode="decimal" min="0"></label><label for="qDue">تاريخ الاستحقاق<input id="qDue" type="date"></label></div>
      <button class="btn primary" data-act="addChq">حفظ الشيك</button>

      <div class="card"><h2>الشيكات</h2><div class="list">${[...S.cheques].sort((a,b)=>(a.status==='pending'?0:1)-(b.status==='pending'?0:1)||a.due.localeCompare(b.due)).map(q=>{const late=q.status==='pending'&&new Date(q.due+'T23:59').getTime()<now;
        return `<div class="li"><span><span class="t">${q.dir==='in'?'وارد':'صادر'} · ${esc(q.partyName||'بدون حساب')}</span><br><span class="muted">${esc(q.bank)} · رقم ${esc(q.no)} · يستحق ${esc(q.due)}</span><br><span class="pill ${late?'bad':st[q.status][0]}">${late?'متأخر':st[q.status][1]}</span></span>

      <button class="btn" data-act="pdfGo" data-sel="att" data-per="week">تقرير الدوام PDF</button></div>

function addToCart(id){
  const it=itemById(id); if(!it) return;
  const step=it.byWeight?Math.min(1,it.qty):1;
  if(step<=0||usedQty(it.id)+step>it.qty){toast(`المتوفر من ${it.name} هو ${qtyTxt(it)} فقط`);render();return}
  const l=cart().lines.find(l=>l.itemId===it.id&&l.unit!=='carton');
  if(l) l.count=r3(l.count+step); else cart().lines.push({itemId:it.id,unit:'piece',count:step});

}

      c.getContext('2d').drawImage(im,0,0,c.width,c.height); PHOTO.data=c.toDataURL('image/jpeg',.72); PHOTO.id=''; URL.revokeObjectURL(u); render(); toast('تم حفظ صورة الفاتورة')}; im.src=u; t.value=''; return}
  if(t.id==='stSound'){S.sound=t.checked; save(); if(t.checked) beep(true)}
  if((t.id==='bkPick'||t.id==='csvPick')&&t.files&&t.files[0]){const f=t.files[0], rd=new FileReader();
    rd.onload=()=>{ if(t.id==='csvPick'){$('#csvTxt').value=String(rd.result).replace(/^\uFEFF/,''); toast('تمت قراءة الملف، اضغط استيراد')}
      else {try{const o=JSON.parse(rd.result); if(!o||!Array.isArray(o.items)||!Array.isArray(o.sales)) throw 0; S=o; save(); render(); toast('تم استرجاع النسخة')}catch(e){toast('الملف ليس نسخة احتياطية صالحة')}}};
    rd.readAsText(f); t.value=''; return}
  if(t.id==='scanFile'&&t.files&&t.files[0]){
    scanMsg('جارٍ قراءة الصورة…'); const img=new Image(), url=URL.createObjectURL(t.files[0]);
    img.onload=async()=>{const code=await decodeImage(img); URL.revokeObjectURL(url);
      if(code) onScan(code); else scanMsg('ما قدرت أقرأ الباركود من الصورة. قرّب الكاميرا وخلّي الإضاءة جيدة، أو اكتب الرقم.')};
    img.onerror=()=>scanMsg('تعذّر فتح الصورة.'); img.src=url; t.value='';
  }
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){closeScan();closeSheet()}
  if(e.key==='Enter'&&e.target.id==='scanTxt') onScan(e.target.value);
  if(e.key==='Enter'&&e.target.id==='pin') A.unlock();
  if(e.key==='Enter'&&e.target.id==='q'){const s=q.trim(); if(!s) return; const byBar=S.items.find(i=>i.barcode===s), hit=byBar||S.items.filter(i=>i.name.includes(s))[0];
    if(byBar) beep(true); else if(/^\d{8,14}$/.test(s)){beep(false); onScan(s); return} if(hit) addToCart(hit.id)}
});
function route(){const h=location.hash.slice(1); if(V[h]) tab=h; render()}
window.addEventListener('hashchange',route);
load(); route(); restoreFromIdb();
if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude\.ai|claudeusercontent/.test(location.host)){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
