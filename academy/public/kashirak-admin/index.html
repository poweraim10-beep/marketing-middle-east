<!DOCTYPE html>
<!-- «كاشيرك الذكي» — لوحة المالك. © 2026 شركة أبو عمر الغزاوي للإعلانات والتسويق الرقمي. جميع الحقوق محفوظة. -->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B1B2B">
<meta name="robots" content="noindex,nofollow">
<title>كاشيرك · لوحة المالك</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
@font-face{font-family:"Alexandria";src:url("fonts/alexandria.woff") format("woff");font-weight:100 900;font-display:swap}
:root{--navy:#0B1B2B;--navy2:#10263B;--deep:#07121D;--gold:#10B981;--gl:#34D399;--cream:#EEF2F5;--ink:#0B1B2B;--muted:#64748B;--line:#E2E8F0;--ok:#047857;--bad:#DC2626;--warn:#B45309;--card:#fff}
*{box-sizing:border-box;margin:0}
html,body{background:var(--cream);color:var(--ink);font-family:'Alexandria',system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
body{min-height:100dvh;padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
.num,.code{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:.5px}
header{position:sticky;top:0;z-index:20;background:linear-gradient(150deg,#10263B 0%,#0B1B2B 55%,#07121D 100%);color:#F1F5F9;padding:calc(14px + env(safe-area-inset-top)) 16px 14px;border-bottom:2px solid var(--gold);box-shadow:0 6px 20px rgba(7,18,29,.25)}
.hd{display:flex;align-items:center;gap:12px}
.hd img{width:44px;height:44px;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.4)}
.hd b{font-family:'Alexandria';font-size:19px;display:block;color:#fff}.hd b i{font-style:normal;color:#34D399}
.hd small{font-size:12.5px;color:#CBD5E1}
.hd .sp{flex:1}
.ib{width:40px;height:40px;border-radius:12px;border:1px solid rgba(52,211,153,.4);background:rgba(255,255,255,.06);color:var(--gl);display:grid;place-items:center;cursor:pointer}
main{padding:14px;max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h2{font-family:'Alexandria';font-size:17px;font-weight:700}
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:0 2px 10px rgba(15,23,42,.06);border:1px solid #E2E8F0;display:flex;flex-direction:column;gap:12px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{border-radius:18px;padding:14px;background:#fff;border:1px solid #E2E8F0;box-shadow:0 2px 10px rgba(15,23,42,.05);display:flex;flex-direction:column;gap:4px;cursor:pointer;text-align:start}
.kpi .l{font-size:13px;color:var(--muted)}
.kpi .v{font-family:'Alexandria';font-weight:700;font-size:28px;line-height:1.1}
.kpi.hero{grid-column:1/-1;background:linear-gradient(150deg,#10263B,#0B1B2B 60%);color:#fff;border:1px solid rgba(52,211,153,.5)}
.kpi.hero .l{color:#CBD5E1}.kpi.hero .v{font-size:34px;background:linear-gradient(180deg,#ECFDF5,#34D399 45%,#047857);-webkit-background-clip:text;background-clip:text;color:transparent}
.kpi.ok .v{color:var(--ok)}.kpi.warn .v{color:var(--warn)}.kpi.bad .v{color:var(--bad)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid #F1F5F9;cursor:pointer}
.li:last-child{border-bottom:0}
.av{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-family:'Alexandria';font-weight:700;color:#fff;flex:none;background:linear-gradient(150deg,#10263B,#0B1B2B)}
.li .t{font-weight:700}.li .s{font-size:13px;color:var(--muted)}
.grow{flex:1;min-width:0}.grow .t,.grow .s{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grow br{display:none}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:700;white-space:nowrap}
.pill.ok{background:#D1FAE5;color:#065F46}.pill.trial{background:#E8F1FD;color:#1E5FA8}.pill.warn{background:#FDF1DC;color:#92400E}.pill.bad{background:#FBE7E8;color:#A8262B}.pill.gold{background:linear-gradient(180deg,#ECFDF5,#34D399);color:#064E3B}.pill.mute{background:#F1F5F9;color:#5F6675}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 16px;border-radius:14px;border:1px solid var(--line);background:#fff;font-weight:700;cursor:pointer;text-decoration:none;color:var(--ink)}
.btn.primary{background:linear-gradient(150deg,#10263B,#0B1B2B);color:#fff;border-color:transparent}
.btn.gold{background:linear-gradient(180deg,#A7F3D0,#10B981);color:#022C22;border-color:transparent;box-shadow:0 6px 16px rgba(4,120,87,.35)}
.btn.wa{background:#25D366;color:#fff;border-color:transparent}
.btn.danger{color:var(--bad);border-color:#F2C9CB}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:11px}
.btn.block{width:100%}
.btn:disabled{opacity:.55}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:none;padding:8px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
.plans{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.plan{border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:10px 6px;text-align:center;cursor:pointer;font-weight:700}
.plan small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.plan[aria-pressed=true]{border-color:var(--gold);background:linear-gradient(180deg,#ECFDF5,#D1FAE5);box-shadow:0 0 0 3px rgba(52,211,153,.35)}
label{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600;color:#3C4658}
input,select,textarea{width:100%;min-height:46px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:#FFFFFF;font-size:16px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(52,211,153,.3)}
.search{position:relative}.search input{padding-inline-start:40px}.search svg{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid #E2E8F0;display:grid;grid-template-columns:repeat(5,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(15,23,42,.06)}
nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);padding:6px 0;cursor:pointer;border-radius:12px}
nav button[aria-current=page]{color:var(--navy)}
nav button[aria-current=page] .ic{background:linear-gradient(180deg,#ECFDF5,#34D399);color:#064E3B}
nav .ic{width:44px;height:30px;border-radius:999px;display:grid;place-items:center}
.sheet{position:fixed;inset:0;z-index:50;display:none;background:rgba(7,18,29,.5);backdrop-filter:blur(2px)}
.sheet.show{display:flex;align-items:flex-end;justify-content:center}
.sbox{background:var(--cream);width:100%;max-width:760px;max-height:92dvh;overflow:auto;border-radius:24px 24px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.shd{display:flex;align-items:center;justify-content:space-between}.shd h2{font-size:19px}
.x{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:20px}
.codebox{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:14px;background:linear-gradient(150deg,#10263B,#0B1B2B);color:#fff;border:1px solid rgba(52,211,153,.5)}
.codebox .code{font-size:20px;font-weight:700;color:var(--gl)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed #E2E8F0;font-size:14.5px}.kv:last-child{border:0}.kv span:first-child{color:var(--muted)}
.empty{padding:26px 10px;text-align:center;color:var(--muted)}
.toast{position:fixed;bottom:calc(96px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;border:1px solid var(--gold);padding:10px 18px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:80;white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1}
.bar{height:10px;border-radius:999px;background:#F1F5F9;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#047857,#34D399);border-radius:999px}
.login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(900px 700px at 50% 20%,#10263B 0%,#0B1B2B 50%,#07121D 100%)}
.login .card{width:100%;max-width:420px;text-align:center}
.login img{width:96px;height:96px;border-radius:24px;margin:0 auto;box-shadow:0 10px 24px rgba(0,0,0,.35)}
.spin{width:34px;height:34px;border-radius:50%;border:4px solid #E2E8F0;border-top-color:var(--gold);animation:sp .8s linear infinite;margin:40px auto}@keyframes sp{to{transform:rotate(360deg)}}
[hidden]{display:none!important}

.ck{display:flex!important;flex-direction:row!important;align-items:center;gap:10px;font-weight:600;margin:4px 0}.ck input{width:22px!important;height:22px!important;flex:none;margin:0}
.bzl{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}.bz{font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 8px;line-height:1.6}.bz.ok{background:#ECFDF5;color:#047857}.bz.q{background:#F1F5F9;color:#64748B}.bz.g{background:#EFF6FF;color:#1D4ED8}.bz.w{background:#FEF2F2;color:#B91C1C}
</style>
</head>
<body>
<div id="app"><div class="spin"></div></div>
<div class="sheet" id="sheet"><div class="sbox" id="sbox"></div></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
const API='/kashirak-api/admin/';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(Math.round(n*100)/100).toLocaleString('en-US',{maximumFractionDigits:2});
const DAY=864e5;
let actF='day', AD_IMG='', D=null, tab='home', shopFilter='all', shopQ='', codeFilter='new', codeQ='';
const PLAN_ORDER=['m1','m2','m3','m6','y1','life'];
const PLAN_NAME={m1:'شهر',m2:'شهرين',m3:'3 شهور',m6:'6 شهور',y1:'سنة',life:'مفتوح'};
const DEF_PRICE={m1:39,m2:75,m3:99,m6:189,y1:349,life:999};
const prices=()=>{try{return Object.assign({},DEF_PRICE,JSON.parse(localStorage.getItem('ksr-admin-prices')||'{}'))}catch(e){return {...DEF_PRICE}}};
const planLabel=p=>PLAN_NAME[p]||(String(p||'').startsWith('d')?p.slice(1)+' يوم':p==='manual'?'تعديل يدوي':'—');
const dayTs=d=>D.epoch+d*DAY;
const fday=t=>t?new Date(t).toLocaleDateString('ar-u-nu-latn',{day:'numeric',month:'short',year:'numeric'}):'—';
const ago=t=>{if(!t) return 'ما اشتغل لسا'; const m=Math.floor((Date.now()-t)/60000); if(m<2) return 'شغّال هلأ'; if(m<60) return `قبل ${m} دقيقة`; const h=Math.floor(m/60); if(h<24) return `قبل ${h} ساعة`; const d=Math.floor(h/24); return d===1?'مبارح':`قبل ${d} يوم`};
const waNum=p=>{let d=String(p||'').replace(/\D/g,''); if(d.startsWith('00')) d=d.slice(2); if(d.startsWith('0')) d='970'+d.slice(1); return d};
const APPURL='marketingmiddleeast.com/kashirak';
function toast(m){const t=$('#toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('show'),2600)}
async function copy(txt){try{await navigator.clipboard.writeText(txt); toast('انسخ ✓')}catch(e){const a=document.createElement('textarea');a.value=txt;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();toast('انسخ ✓')}}
/* دفتر المالك: كل اشتراك محسوب بمبلغه الحقيقي، والكود الجاهز اللي ما انباع ما بينحسب إلا إذا اخترته */
const BK=()=>D.books||{adj:{},exp:[]};
function ledger(){const A=BK().adj||{}; return D.codes.filter(c=>c.status!=='void').map(c=>{const o=A[c.code]||{}; const def=c.status==='used'||c.kind!=='code';
  return {c,key:c.code,p:o.p!==undefined?+o.p:(+c.price||0),on:o.on!==undefined?!!o.on:def,n:o.n||'',ts:c.used_at||c.created}}).sort((a,b)=>b.ts-a.ts)}
const incOf=(from,to)=>ledger().filter(e=>e.on&&e.ts>=from&&e.ts<(to||9e15)).reduce((a,e)=>a+e.p,0);
const expOf=(from,to)=>(BK().exp||[]).filter(e=>e.ts>=from&&e.ts<(to||9e15)).reduce((a,e)=>a+(+e.amt||0),0);
async function saveBooks(b){const r=await call('books',b); D.books={adj:r.adj,exp:r.exp}; render()}
async function call(path,body){
  const r=await fetch(API+path,{method:body?'POST':'GET',headers:body?{'content-type':'application/json'}:{},body:body?JSON.stringify(body):undefined,credentials:'same-origin',cache:'no-store'});
  let j={}; try{j=await r.json()}catch(e){}
  if(r.status===403){showLogin();throw new Error('login')}
  if(!r.ok) throw new Error(j.error||('خطأ '+r.status)); return j}

/* ---------- status of each shop ---------- */
function stateOf(s){
  const t=D.today, now=Date.now();
  if(s.visit) return {k:'visit',left:0,exp:null};
  if(s.lic&&s.lic.exp>=t){const left=s.lic.exp-t; return {k:s.lic.exp>=D.lifetime?'life':left<=7?'soon':'paid',left,exp:dayTs(s.lic.exp+1),plan:s.lic.plan}}
  if(s.legacyExp&&s.legacyExp>now){const left=Math.ceil((s.legacyExp-now)/DAY); return {k:left<=7?'soon':'paid',left,exp:s.legacyExp,plan:'قديم'}}
  if(s.trialEnds&&s.trialEnds>now) return {k:'trial',left:Math.ceil((s.trialEnds-now)/DAY),exp:s.trialEnds};
  const ended=(s.lic&&s.lic.exp>0)?dayTs(s.lic.exp+1):(s.legacyExp||s.trialEnds||null);
  const wasPaid=!!(s.lic&&s.lic.exp>0)||!!s.legacyExp; return {k:wasPaid?'over':'tover',left:0,exp:ended,wasPaid}}
function pillOf(st){return {life:'<span class="pill gold">⭐ مفتوح</span>',paid:`<span class="pill ok">مشترك · ${st.left} يوم</span>`,soon:`<span class="pill warn">بينتهي بعد ${st.left} يوم</span>`,trial:`<span class="pill trial">تجربة · ${st.left} يوم</span>`,over:'<span class="pill bad">منتهي</span>',tover:'<span class="pill warn">خلصت التجربة</span>',visit:'<span class="pill mute">زائر</span>'}[st.k]}
function inFilter(st,f=shopFilter){ if(f==='all') return true; if(f==='paid') return ['paid','life','soon'].includes(st.k); if(f==='tryall') return ['trial','tover','visit'].includes(st.k); return st.k===f }
const shopById=id=>D.shops.find(x=>x.id===id&&x.kind==='shop');
const initials=n=>esc(String(n||'؟').trim().slice(0,1));

/* ---------- rendering ---------- */
function shell(body){return `<header><div class="hd"><img src="icons/icon-192.png" alt=""><div><b>كاشيرك <i>الذكي</i></b><small>لوحة المالك</small></div><span class="sp"></span><span id="syncPill" style="font-size:12px;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.12)">${syncTxt()}</span>
  <button class="ib" data-a="reload" aria-label="تحديث"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5"/></svg></button></div></header>
  <main>${body}</main>
  <nav>${[['home','الرئيسية','<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'],['shops','المشتركين','<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14.5a6 6 0 0 1 3.5 5.5"/>'],['codes','الأكواد','<rect x="3" y="7" width="18" height="11" rx="2"/><path d="M7 11h.01M11 11h6M7 14h10"/>'],['money','الدخل','<path d="M4 19V9M10 19V5M16 19v-7M22 19H2"/>'],['ctl','التحكم','<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>']].map(([k,l,ic])=>`<button data-a="tab" data-t="${k}" ${tab===k?'aria-current="page"':''}><span class="ic"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${ic}</svg></span>${l}</button>`).join('')}</nav>`}
function render(){ if(!D) return; $('#app').innerHTML=shell(V[tab]()); }
const V={
home(){
  const sh=D.shops.map(s=>({s,st:stateOf(s)}));
  const c=k=>sh.filter(x=>x.st.k===k).length;
  const paid=c('paid')+c('life')+c('soon');
  const month=new Date(); month.setDate(1); month.setHours(0,0,0,0);
  const inc=incOf(+month), spent=expOf(+month);
  const ready=D.codes.filter(x=>x.status==='new'&&x.kind==='code').length;
  const active7=D.shops.filter(s=>s.lastSeen&&Date.now()-s.lastSeen<7*DAY).length;
  const follow=sh.filter(x=>x.st.k==='soon'||(x.st.k==='over'||x.st.k==='tover')&&x.st.exp&&Date.now()-x.st.exp<30*DAY||x.st.k==='trial'&&x.st.left<=2).sort((a,b)=>(a.st.exp||0)-(b.st.exp||0)).slice(0,12);
  return `<div class="kpis">
    <button class="kpi hero" data-a="tab" data-t="money"><span class="l">صافي هذا الشهر</span><span class="v"><span class="num">${fmt(inc-spent)}</span> ₪</span><span class="l">دخل <span class="num">${fmt(inc)}</span> − مصروفات <span class="num">${fmt(spent)}</span> ₪ · ${paid} محل مشترك · ${active7} محل اشتغل آخر 7 أيام</span></button>
    <button class="kpi ok" data-a="filter" data-f="paid"><span class="l">مشتركين فعّالين</span><span class="v num">${paid}</span></button>
    <button class="kpi" data-a="filter" data-f="trial"><span class="l">بفترة التجربة هلأ</span><span class="v num">${c('trial')}</span></button>
    <button class="kpi warn" data-a="filter" data-f="tover"><span class="l">خلصت تجربتهم وما اشتركوا</span><span class="v num">${c('tover')}</span></button>
    <button class="kpi" data-a="filter" data-f="visit"><span class="l">زوار ما جهّزوا المحل</span><span class="v num">${c('visit')}</span></button>
    <button class="kpi warn" data-a="filter" data-f="soon"><span class="l">بينتهوا خلال 7 أيام</span><span class="v num">${c('soon')}</span></button>
    <button class="kpi bad" data-a="filter" data-f="over"><span class="l">منتهيين</span><span class="v num">${c('over')}</span></button>
    <button class="kpi" data-a="filter" data-f="tryall"><span class="l">كل اللي جرّبوا التطبيق</span><span class="v num">${c('trial')+c('tover')+c('visit')}</span></button>

/* مين شغّال؟ نشاط المحلات حسب آخر ظهور (قراءة بس) */
const ACTF=[['now','شغّالين هلأ',3600e3],['day','آخر 24 ساعة',86400e3],['d3','آخر 3 أيام',3*86400e3],['week','آخر أسبوع',7*86400e3],['off','متوقفين (+7 أيام)',-1]];
function actIn(s,f){ const L=s.lastSeen||0, age=Date.now()-L, x=ACTF.find(a=>a[0]===f); if(!x) return true; if(x[2]<0) return !L||age>=7*86400e3; return L&&age<x[2] }
function actDot(s){ const L=s.lastSeen||0, age=Date.now()-L; return !L?'#94A3B8':age<3600e3?'#10B981':age<86400e3?'#34D399':age<3*86400e3?'#F59E0B':age<7*86400e3?'#FB923C':'#EF4444' }
function actCard(){ const pool=D.shops.filter(s=>s.kind==='shop'||(s.items||s.sales));
  const L=pool.filter(s=>actIn(s,actF)).sort((a,b)=>(b.lastSeen||0)-(a.lastSeen||0));
  return `<div class="card" id="actCard"><div class="row"><h2>🟢 مين شغّال على التطبيق؟</h2><span class="pill mute">${L.length}</span></div>
  <p style="margin:0;font-size:12.5px;color:var(--muted)">مرتّبين حسب آخر مرة فتحوا التطبيق. الأخضر شغّال، والأحمر متوقف عن الشغل.</p>
  <div class="chips">${ACTF.map(([k,l])=>`<button class="chip" data-a="actF" data-f="${k}" aria-pressed="${actF===k}">${l} <span class="num">${pool.filter(s=>actIn(s,k)).length}</span></button>`).join('')}</div>
  <div class="list">${L.slice(0,80).map(s=>{ const st=stateOf(s); return `<div class="li" data-a="shop" data-id="${esc(s.id)}" data-k="${s.kind}"><span class="av" style="position:relative">${initials(s.name)}<i style="position:absolute;bottom:-2px;left:-2px;width:12px;height:12px;border-radius:50%;background:${actDot(s)};border:2px solid #fff"></i></span><span class="grow"><span class="t">${esc(s.name||'بدون اسم')}</span><br><span class="s" style="white-space:normal;display:block;line-height:1.6"><b style="color:${actDot(s)}">● ${ago(s.lastSeen)}</b>${s.acct?` · <span class="num">${s.acct}</span>`:''}${s.owner?' · '+esc(s.owner):''}<br>📦 <span class="num">${s.items||0}</span> صنف · 🧾 <span class="num">${s.sales||0}</span> بيعة</span></span>${s.stopped?'<span class="pill bad">⛔ موقوف</span>':pillOf(st)}</div>` }).join('')||'<div class="empty">ما في حدا بهالفترة</div>'}${L.length>80?`<div class="empty">وفي كمان <span class="num">${L.length-80}</span>… استعمل البحث بالمشتركين</div>`:''}</div></div>` }
const TPLN={market:'سوبر ماركت',pharm:'صيدلية',veg:'فواكه وخضروات',meat:'لحوم ومجمدات وأسماك',deli:'لحوم باردة وألبان وأجبان',bake:'مخبوزات وحلويات',dry:'حبوب وبهارات ومخللات',nuts:'مكسرات وبزر',falafel:'فلافل وحمص وفول',shawarma:'شاورما ووجبات سريعة',cafe:'كافيه ومشروبات',nylon:'نايلون ومستلزمات تغليف',clean:'منظفات وأدوات منزلية',juice:'مرطبات وعصائر وبوظة',sweets:'حلويات عربية',clothes:'ملابس وأحذية',salon:'حلاقة وصالونات',stat:'مكتبة وقرطاسية',mobile:'جوالات وإكسسوارات'};
/* مجال شغل المحل: من اللي اختاره بالتطبيق، ومع تنبيه إذا اسم المحل بيدل على مجال تاني */
const NAMEHINT=[[/بدل|بدلة|تأجير|تاجير|فسات|عرائس|عروس|سهرة|الأناقة|اناقة/,'r','تأجير (فساتين أو بدل)'],[/صيدل|فارم/,'p','صيدلية'],[/فاشون|fashion|ملابس|ألبسة|البسة|أحذية|احذية|بوتيك/i,'clothes','ملابس وأحذية'],[/جوال|موبايل|mobile/i,'mobile','جوالات'],[/مكتبة|قرطاس/,'stat','مكتبة'],[/حلاق|صالون|كوافير/,'salon','صالون']];
function bizTag(s){ const b=s.biz, nm=s.name||'', guess=NAMEHINT.find(([re])=>re.test(nm));
  if(!b) return `<span class="bz q">❔ المجال لسا مش معروف</span>${guess?`<span class="bz g">💡 الاسم بيدل على: ${guess[2]}</span>`:''}`;
  const L=[]; if(b.r){ const su=b.k==='s', w=su?'بدل':'فساتين', ic=su?'🤵':'👗'; L.push(b.r===2?`${ic} بيع + تأجير ${w}`:`${ic} تأجير ${w}`+(b.d||b.b?` (${b.d||0} ${su?'بدلة':'فستان'} · ${b.b||0} حجز)`:'')) } if(b.p) L.push('💊 صيدلية'); (b.t||[]).filter(k=>k!=='pharm'||!b.p).forEach(k=>L.push(TPLN[k]||k));
  const has=k=>k==='r'?!!b.r:k==='p'?!!b.p:(b.t||[]).includes(k), wrong=guess&&!has(guess[1]);
  return `${L.length?`<span class="bz ok">${L.map(esc).join(' · ')}</span>`:'<span class="bz q">❔ ما اختار مجال، بيضيف أصنافه بإيده</span>'}${wrong?`<span class="bz w">⚠️ اسمه بيدل على «${guess[2]}» وهو مش مفعّله</span>`:''}` }
function shopRow(s,st){return `<div class="li" data-a="shop" data-id="${esc(s.id)}" data-k="${s.kind}"><span class="av">${initials(s.name)}</span><span class="grow"><span class="t">${esc(s.name||'بدون اسم')}${s.dup&&s.dup.length?' ⚠️':''}${(s.devices||[]).some(d=>d.main&&/لابتوب|ماك/.test(d.label||''))?' 💻':''}</span><br><span class="s">${s.acct?`حساب <span class="num">${s.acct}</span> · `:''}${s.owner?esc(s.owner)+' · ':''}${s.phone&&!s.owner?`<span class="num">${esc(s.phone)}</span> · `:''}${['trial','tover','visit'].includes(st.k)&&s.created?'بدأ '+new Date(s.created).toLocaleDateString('ar-u-nu-latn',{day:'numeric',month:'short'})+' · ':''}${ago(s.lastSeen)}</span><br><span class="bzl">${bizTag(s)}</span></span>${(s.stopped?'<span class="pill bad">⛔ موقوف</span>':pillOf(st))}</div>`}
function codeRow(c){const st={new:'<span class="pill ok">جاهز</span>',used:'<span class="pill mute">مستعمل</span>',void:'<span class="pill bad">ملغي</span>'}[c.status];
  return `<div class="li" data-a="code" data-c="${esc(c.code)}"><span class="grow"><span class="t code">${esc(c.code)}</span><br><span class="s">${planLabel(c.plan)} · <span class="num">${fmt(+c.price||0)}</span> ₪${c.acct?' · حساب <span class="num">'+c.acct+'</span>':''}${c.owner?' · '+esc(c.owner):(c.note?' · '+esc(c.note):'')}${c.status==='used'?' · فعّله '+esc(c.used_label||'محل')+' '+fday(c.used_at):''}</span></span>${st}</div>`}

async function qFlush(){ if(QS==='busy'||!navigator.onLine||!QQ.length){syncUI();return} QS='busy'; syncUI();

  async adSheet(){ open(`${head('📣 الإعلان داخل التطبيق')}<div class="spin"></div>`); let a={}; try{a=await call('ad')}catch(e){}

      <button class="btn primary block" data-a="adSave">نشر الإعلان</button>`);
    $('#adImg').addEventListener('change',async e=>{const f=e.target.files[0]; if(!f) return; const u=URL.createObjectURL(f), im=new Image(); im.src=u; await im.decode(); const k=Math.min(1,1000/im.naturalWidth), c=document.createElement('canvas'); c.width=Math.round(im.naturalWidth*k); c.height=Math.round(im.naturalHeight*k); c.getContext('2d').drawImage(im,0,0,c.width,c.height); AD_IMG=c.toDataURL('image/jpeg',.78); URL.revokeObjectURL(u); $('#adPrev').innerHTML=`<img src="${AD_IMG}" style="width:90px;border-radius:10px">`})},
  adImgDel(){AD_IMG=''; $('#adPrev').innerHTML=''},

  async pushSheet(){ open(`${head('🔔 إشعار لكل المحلات')}<div class="spin"></div>`); let st={subs:0,shops:0}; try{st=await call('pushstats')}catch(e){}

        return `<div class="li" style="cursor:default"><span class="grow"><span class="t">${cur?'⭐ النسخة الحالية':W[x.why]||'نسخة'} · ${new Date(x.t||x.updated||Date.now()).toLocaleString('ar-u-nu-latn',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}</span><br>

        <div class="card"><div class="list">${row(r.current,true)}${r.list.map(x=>row(x,false)).join('')||'<div class="empty">لسا ما في نسخ سابقة. أول نسخة بتنحفظ بعد 6 ساعات من الاستعمال.</div>'}</div></div>`)

  async stockSheet(d){ const s=shopById(d.id); try{ const r=await call('stockval?id='+encodeURIComponent(d.id)); const f=n=>Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});

      <div class="kv"><span>عدد الأصناف</span><span class="num">${r.items}</span></div><div class="kv"><span>أصناف إلها كمية بالمخزون</span><span class="num">${r.inStock}</span></div><div class="kv"><span>مجموع القطع</span><span class="num">${f(r.units)}</span></div>

  passSheet(d){const s=shopById(d.id), pw=String(100000+Math.floor(Math.random()*900000));
    open(`${head('كلمة سر جديدة · '+esc(s.name))}<p style="font-size:14px">اكتب كلمة سر جديدة للزبون (6 أحرف أو أرقام على الأقل)، أو خلّي المقترحة.</p>

      <a class="btn wa block" href="https://wa.me/${(s.wa||waNum(s.phone))}?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">ابعتها لـ«${esc(s.owner||s.name)}» على واتساب</a><button class="btn block" data-a="close">تمام</button>`); load()}catch(e){toast(e.message)}},
  editSheet(d){const s=shopById(d.id);
    open(`${head('تعديل بيانات الحساب')}<label>اسم صاحب المحل<input id="edO" value="${esc(s.owner||'')}"></label><label>اسم المحل<input id="edN" value="${esc(s.name||'')}"></label>
    <label>رقم الجوال<input id="edP" class="num" inputmode="tel" value="${esc(s.phone||'')}" dir="ltr"></label><label>رقم الواتساب (مع 970 أو 972)<input id="edW" class="num" inputmode="tel" value="${esc(s.wa||'')}" dir="ltr" placeholder="970599123456"></label><button class="btn gold block" data-a="saveEdit" data-id="${esc(d.id)}">حفظ</button>

  async flipWa(d){const sh=shopById(d.id); const cur=String(sh.wa||waNum(sh.phone)); const local=cur.replace(/^(970|972)/,''); const next=(cur.startsWith('972')?'970':'972')+local;

  trialSheet(d){const s=shopById(d.id);

  async cancelLic(d){ if(!confirm('أكيد بدك توقف اشتراك هذا المحل؟ التطبيق عنده بيصير للقراءة بس.')) return;

  async saveLedger(){const adj=Object.assign({},BK().adj); document.querySelectorAll('.bkP').forEach(i=>{const k=i.dataset.k, c=D.codes.find(x=>x.code===k), on=document.querySelector(`.bkOn[data-k="${k}"]`).checked, p=+i.value||0;

    try{await saveBooks({adj,exp:BK().exp||[]}); toast('✓ انحفظ الكشف')}catch(e){toast(e.message)}},

  async logout(){await fetch('/api/logout',{method:'POST',credentials:'same-origin'}).catch(()=>{}); D=null; showLogin()}
};
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]'); if(!t) return; if(t.id==='sheet'&&e.target!==t) return; const a=A[t.dataset.a]; if(a){e.preventDefault&&t.tagName!=='A'&&e.preventDefault(); a(t.dataset,t)}});

document.addEventListener('input',e=>{ if(e.target.id==='ncAcct'){e.target.value=e.target.value.replace(/\D/g,'').slice(0,6); clearTimeout(lkT); lkT=setTimeout(lookupAcct,e.target.value.length===6?50:400)}
  if(e.target.id==='shopQ'){shopQ=e.target.value; const sh=D.shops.map(s=>({s,st:stateOf(s)})).filter(x=>{const q=shopQ.trim(); return inFilter(x.st)&&(!q||(x.s.name+' '+x.s.phone+' '+x.s.id+' '+(x.s.acct||'')+' '+(x.s.owner||'')).includes(q))}); $('#shopList').innerHTML=sh.map(({s,st})=>shopRow(s,st)).join('')||'<div class="empty">ما في نتائج</div>'}
  if(e.target.id==='codeQ'){codeQ=e.target.value; const pos=e.target.selectionStart; render(); const i=$('#codeQ'); i.focus(); i.setSelectionRange(pos,pos)} });
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&(e.target.id==='lgP'||e.target.id==='lgE')) A.login() });
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&D) load() });
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).catch(()=>{});
/* تحديث تلقائي للوحة */
const BUILD='20261121114207'; let UPD=false;
async function checkUpdate(){ try{const t=await (await fetch('index.html?u='+Date.now(),{cache:'no-store',credentials:'same-origin'})).text(); const m=t.match(/const\x20BUILD='([^']+)'/); if(m&&m[1]!==BUILD&&!/__BUILD/.test(m[1])) UPD=true}catch(e){} applyUpdate()}
function applyUpdate(){ if(UPD&&!$('#sheet').classList.contains('show')&&!(document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName))) location.reload() }
setInterval(checkUpdate,3*60e3); setTimeout(checkUpdate,5000); setInterval(applyUpdate,15e3);
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible') checkUpdate() });
load();
</script>
