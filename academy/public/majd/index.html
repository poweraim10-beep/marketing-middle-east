<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>المجد · الطلبات والتوصيل</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Identity «وصلة» on the MME system: navy/ink base, blue→cyan energy, metallic silver; bright luminous surfaces. Phone-first, bottom tab bar. */
:root{
  --bg:#f3f6fb; --surface:#ffffff; --surface2:#f0f4fa; --ink:#0b1020; --muted:#5b6780; --line:#e2e8f2;
  --brand:#0b1020; --brand2:#14204a; --brand-ink:#eef3fb; --saffron:#22d3ee; --saffron-ink:#03141b;
  --accent:#2563eb; --accent-ink:#ffffff; --money:#1d4ed8; --soft:#e8f0fe;
  --ok:#0f9d6b; --warn:#d48806; --bad:#dc4a26; --info:#2563eb; --grey:#7a8599;
  --grad:linear-gradient(100deg,#2563eb,#22d3ee);
  --metal:linear-gradient(180deg,#ffffff 0%,#dde4ee 38%,#93a0b4 54%,#e9eef5 74%,#b7c2d2 100%);
  --shadow:0 1px 2px rgba(11,16,32,.05),0 14px 34px -16px rgba(37,99,235,.28);
  --display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"Readex Pro","IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --num:"Unbounded","Readex Pro",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#060a16; --surface:#0f1628; --surface2:#141d33; --ink:#eef3fb; --muted:#93a0b8; --line:#1f2a44;
    --brand:#060a16; --brand2:#12204a; --soft:#132552; --accent:#3b82f6; --money:#22d3ee;
    --ok:#34d399; --warn:#fbbf24; --bad:#fb7a55; --info:#60a5fa; --grey:#9aa4b8;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px -16px rgba(34,211,238,.18);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#060a16; --surface:#0f1628; --surface2:#141d33; --ink:#eef3fb; --muted:#93a0b8; --line:#1f2a44;
  --brand:#060a16; --brand2:#12204a; --soft:#132552; --accent:#3b82f6; --money:#22d3ee;
  --ok:#34d399; --warn:#fbbf24; --bad:#fb7a55; --info:#60a5fa; --grey:#9aa4b8;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 14px 34px -16px rgba(34,211,238,.18);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 120px}

/* brand band */
.brandbar{background:linear-gradient(160deg,var(--brand2),var(--brand) 60%);color:var(--brand-ink);margin:0 -16px;padding:18px 18px 20px;border-radius:0 0 28px 28px;position:relative;overflow:hidden}
.brandbar .route{position:absolute;inset:0;pointer-events:none;opacity:.5}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;position:relative;z-index:1}
.brand{display:flex;align-items:center;gap:11px;min-width:0}
.logo{width:44px;height:44px;flex:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.25))}
.wordmark{font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1;letter-spacing:0}
.wordmark .dot{color:var(--saffron)}
.wordmark small{display:block;font-family:var(--body);font-weight:500;font-size:.76rem;opacity:.72;margin-top:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:46vw}
.seg{display:inline-flex;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:3px;flex:none}
.seg button{border:0;background:none;padding:6px 13px;border-radius:999px;cursor:pointer;font-weight:600;font-size:.85rem;color:var(--brand-ink);opacity:.78}
.seg button.on{background:var(--saffron);color:var(--saffron-ink);opacity:1}
.hello{position:relative;z-index:1;margin-top:18px;font-family:var(--display);font-weight:600;font-size:1.08rem;text-wrap:balance}
.hello span{opacity:.65;font-family:var(--body);font-weight:400;font-size:.85rem;display:block;margin-top:2px}
.strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px;position:relative;z-index:1}
.strip div{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:9px 4px 8px;text-align:center}
.strip b{display:block;font-family:var(--display);font-size:1.25rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.2}
.strip span{font-size:.7rem;opacity:.75}
.strip .m{background:var(--saffron);border-color:var(--saffron);color:var(--saffron-ink)}
.strip .m span{opacity:.85}

/* bottom nav */
nav.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:10;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px 10px calc(8px + env(safe-area-inset-bottom))}
nav.tabbar .in{max-width:640px;margin:0 auto;display:flex;align-items:flex-end;justify-content:space-around}
nav.tabbar button{border:0;background:none;display:grid;justify-items:center;gap:2px;padding:6px 10px;cursor:pointer;color:var(--muted);font-size:.72rem;font-weight:600;min-width:64px;position:relative}
nav.tabbar button svg.i{width:23px;height:23px}
nav.tabbar button.on{color:var(--accent)}
nav.tabbar button.on::after{content:"";position:absolute;top:-6px;width:22px;height:3px;border-radius:2px;background:var(--saffron)}
nav.tabbar button.plus{transform:translateY(-14px)}
nav.tabbar button.plus .disc{width:54px;height:54px;border-radius:18px;background:var(--brand);color:var(--saffron);display:grid;place-items:center;box-shadow:0 10px 22px -8px rgba(12,38,36,.6);border:3px solid var(--bg)}
nav.tabbar button.plus .disc svg.i{width:26px;height:26px;stroke-width:2.4}
nav.tabbar button.plus::after{display:none}

.banner{margin-top:12px;padding:10px 12px;border-radius:14px;background:var(--soft);color:var(--ink);font-size:.86rem;display:flex;gap:8px;align-items:flex-start}
.banner.err{background:color-mix(in srgb,var(--bad) 13%,var(--surface))}
main{display:grid;gap:12px;padding-top:16px}
.pagehead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pagehead h2{font-family:var(--display);font-size:1.15rem;margin:0}
.pagehead span{color:var(--muted);font-size:.85rem}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.84rem;white-space:nowrap;cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.chip b{font-variant-numeric:tabular-nums;background:var(--surface2);border-radius:999px;padding:0 7px;font-size:.78rem}
.chip.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.chip.on b{background:var(--saffron);color:var(--saffron-ink)}
.searchbox{position:relative}
.searchbox svg.i{position:absolute;top:50%;right:12px;transform:translateY(-50%);color:var(--muted)}
.searchbox input{padding-right:40px}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px}
textarea{min-height:72px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
button:focus-visible,a:focus-visible{outline:2px solid var(--saffron);outline-offset:2px}
label{display:grid;gap:5px;font-size:.84rem;color:var(--muted);font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}

/* order card */
.order{position:relative}
.order::before{content:"";position:absolute;inset-block:14px;inset-inline-start:0;width:4px;border-radius:0 4px 4px 0;background:var(--st,var(--grey))}
.ohead{display:grid;grid-template-columns:1fr auto;gap:2px 12px;padding:14px 18px 14px 16px;cursor:pointer;background:none;border:0;width:100%;text-align:right}
.meta{display:flex;gap:8px;align-items:center;font-size:.78rem;color:var(--muted)}
.onum{font-family:var(--display);font-weight:700;color:var(--ink);background:var(--surface2);border-radius:8px;padding:1px 8px;font-size:.78rem}
.oname{font-family:var(--display);font-weight:700;font-size:1.06rem;grid-column:1}
.oarea{color:var(--muted);font-size:.86rem;display:flex;gap:4px;align-items:center;grid-column:1}
.oarea svg.i{width:15px;height:15px}
.amtbox{grid-column:2;grid-row:1 / span 3;display:grid;justify-items:end;align-content:center;gap:4px}
.amt{font-family:var(--display);font-weight:800;font-size:1.15rem;color:var(--money);font-variant-numeric:tabular-nums}
.amtl{font-size:.7rem;color:var(--muted)}
.pill{font-size:.74rem;font-weight:700;padding:3px 10px;border-radius:999px;color:var(--st);background:color-mix(in srgb,var(--st) 13%,transparent);white-space:nowrap}
.obody{padding:2px 18px 16px 16px;display:grid;gap:12px;border-top:1px solid var(--line)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding-top:14px}
.steps div{display:grid;gap:5px;font-size:.7rem;color:var(--muted);text-align:center}
.steps i{display:block;height:5px;border-radius:3px;background:var(--line)}
.steps .done i{background:var(--accent)} .steps .done{color:var(--ink);font-weight:600}
.steps .cur i{background:var(--saffron)} .steps .cur{color:var(--ink);font-weight:700}
.kv{display:grid;grid-template-columns:96px 1fr;gap:6px 10px;margin:0;font-size:.92rem;background:var(--surface2);border-radius:14px;padding:12px}
.kv dt{color:var(--muted)} .kv dd{margin:0;word-break:break-word}
table.items{width:100%;border-collapse:collapse;font-size:.92rem;font-variant-numeric:tabular-nums}
table.items td{padding:7px 0;border-bottom:1px dashed var(--line)}
table.items td:last-child{text-align:left;font-weight:600}
.row{display:flex;flex-wrap:wrap;gap:8px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 14px;border-radius:12px;cursor:pointer;font-weight:600;text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:.9rem}
.btn svg.i{width:18px;height:18px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dark{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.sf{background:var(--saffron);border-color:var(--saffron);color:var(--saffron-ink)}
.btn.wa{background:#1d9a55;border-color:#1d9a55;color:#fff}
.btn.ghost{background:var(--surface2);border-color:transparent}
.btn.danger{color:var(--bad);background:none;border-color:color-mix(in srgb,var(--bad) 35%,var(--line))}
.btn.tile3{flex-direction:column;gap:4px;padding:10px 6px;font-size:.78rem;background:var(--surface2);border-color:transparent}
.btn.tile3 svg.i{width:22px;height:22px;color:var(--accent)}
.btn.big{width:100%;padding:14px;font-size:1rem;border-radius:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.hint{font-size:.8rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}
.form{padding:18px;display:grid;gap:13px}
.sec{font-family:var(--display);font-size:1rem;margin:6px 0 0;display:flex;align-items:center;gap:8px}
.sec .n{width:24px;height:24px;border-radius:8px;background:var(--brand);color:var(--saffron);display:grid;place-items:center;font-size:.78rem}
.itemrow{display:grid;grid-template-columns:1fr 60px 84px 34px;gap:6px;align-items:center}
.x{border:0;background:var(--surface2);color:var(--bad);width:34px;height:34px;border-radius:10px;font-size:1.2rem;cursor:pointer;display:grid;place-items:center}
.sum{background:var(--brand);color:var(--brand-ink);border-radius:16px;padding:14px;display:grid;gap:5px;font-variant-numeric:tabular-nums;font-size:.92rem}
.sum div{display:flex;justify-content:space-between}
.sum div span:first-child{opacity:.75}
.sum .tot{font-family:var(--display);font-weight:800;font-size:1.15rem;color:var(--saffron);border-top:1px solid rgba(255,255,255,.14);padding-top:8px;margin-top:3px}
.sum .tot span:first-child{opacity:1;color:var(--brand-ink);font-size:.95rem;font-weight:600}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.tile .n{font-family:var(--display);font-size:1.4rem;font-weight:700;font-variant-numeric:tabular-nums}
.tile .l{color:var(--muted);font-size:.8rem}
.tile.hl{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);grid-column:1 / -1}
.tile.hl .n{color:var(--saffron);font-size:1.9rem} .tile.hl .l{color:var(--brand-ink);opacity:.75}
.empty{text-align:center;padding:28px 20px;color:var(--muted);display:grid;justify-items:center;gap:6px}
.empty svg.art{width:150px;height:auto;margin-bottom:6px}
.empty h3{font-family:var(--display);color:var(--ink);font-size:1.1rem;margin:0}
.empty p{margin:0 0 8px;max-width:30ch}
.note{background:color-mix(in srgb,var(--saffron) 14%,var(--surface));border-radius:12px;padding:9px 12px;font-size:.88rem}
.hist{font-size:.78rem;color:var(--muted);display:grid;gap:3px;border-top:1px dashed var(--line);padding-top:10px}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%);background:var(--brand);color:var(--brand-ink);padding:11px 18px;border-radius:14px;font-size:.9rem;z-index:20;max-width:90vw;box-shadow:var(--shadow);border-inline-start:4px solid var(--saffron)}
.listrow{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:.9rem;font-variant-numeric:tabular-nums}
.listrow:last-child{border-bottom:0}
.areaRow{display:grid;grid-template-columns:1fr 80px 34px;gap:6px}
.prodRow{display:grid;grid-template-columns:1fr 84px 34px;gap:6px}
.check{display:flex;gap:10px;align-items:center;color:var(--ink);background:var(--surface2);padding:11px 12px;border-radius:12px;font-weight:500}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.pcard{border:1.5px solid var(--line);border-radius:14px;background:var(--surface);display:grid;overflow:hidden}
.pcard.sel{border-color:var(--accent);background:var(--soft)}
.pmain{border:0;background:none;text-align:right;padding:11px 12px;cursor:pointer;display:grid;gap:3px}
.pname{font-weight:700;font-size:.93rem}
.pprice{font-family:var(--display);color:var(--money);font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}
.pprice small{color:var(--muted);font-family:var(--body);font-weight:500}
.stepper{display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--line);background:var(--surface)}
.stepper button{border:0;background:none;width:44px;height:38px;cursor:pointer;color:var(--accent);display:grid;place-items:center}
.stepper b{font-family:var(--display);font-variant-numeric:tabular-nums}
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow.off .pname{color:var(--muted);text-decoration:line-through}
.prow .btn{padding:8px 10px}
.pimg{width:100%;aspect-ratio:1;object-fit:contain;border-radius:10px;background:#f4f6f5;margin-bottom:4px}
.pinfo{display:flex;gap:12px;align-items:center;min-width:0}
.pthumb{width:52px;height:52px;border-radius:12px;object-fit:contain;background:#f4f6f5;flex:none}
.pthumb.ph,.imgpick .ph{display:grid;place-items:center;color:var(--muted);background:var(--surface2)}
.imgpick{display:flex;gap:12px;align-items:center}
.imgpick img,.imgpick .ph{width:84px;height:84px;border-radius:14px;object-fit:contain;background:#f4f6f5;flex:none}
.imgpick label.btn{display:inline-flex;color:var(--ink);font-size:.88rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.gate{justify-items:stretch;margin-top:6px}
.gicon{width:64px;height:64px;border-radius:20px;background:var(--grad);color:#fff;display:grid;place-items:center;justify-self:center;box-shadow:0 14px 30px -12px rgba(37,99,235,.8)}
.gicon svg.i{width:30px;height:30px}
.gt{font-family:var(--display);text-align:center;margin:4px 0 0;font-size:1.25rem}
.gerr{background:color-mix(in srgb,var(--bad) 12%,var(--surface));color:var(--bad);border-radius:12px;padding:9px 12px;font-weight:600;font-size:.9rem}
.dvbox{border:1.5px solid var(--accent);border-radius:18px;padding:14px;display:grid;gap:11px;background:linear-gradient(180deg,var(--soft),var(--surface) 60%)}
.dvt{font-family:var(--display);font-weight:700;display:flex;gap:8px;align-items:center}
.dvt svg.i{color:var(--accent)}
.lbl{font-size:.84rem;color:var(--muted);font-weight:600}
.pmgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.pm{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 8px;cursor:pointer;font-size:.84rem;font-weight:600;text-align:center;line-height:1.35}
.pm.on{border-color:var(--accent);background:var(--accent);color:#fff}
.rcpt{display:flex;gap:10px;align-items:center}
.rcpt img{width:96px;height:120px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.camlbl{cursor:pointer}
.dvinfo{background:color-mix(in srgb,var(--ok) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--ok) 25%,var(--line));border-radius:14px;padding:12px;display:grid;gap:5px;font-size:.92rem}
.dvinfo span{color:var(--muted)}
.dvinfo .dvt svg.i{color:var(--ok)}
.modal{position:fixed;inset:0;z-index:40;background:rgba(6,10,22,.72);display:grid;place-items:center;padding:16px}
.mbox{background:var(--surface);border-radius:20px;padding:12px;max-width:560px;width:100%;max-height:92vh;overflow:auto;display:grid;gap:10px}
.mhead{display:flex;justify-content:space-between;align-items:center;font-family:var(--display)}
.mbox img{width:100%;border-radius:12px}
[hidden]{display:none!important}
/* ---- MME luxury layer ---- */
.brandbar{background:radial-gradient(120% 90% at 100% 0%,rgba(34,211,238,.28),transparent 55%),radial-gradient(90% 80% at 0% 100%,rgba(37,99,235,.45),transparent 60%),linear-gradient(165deg,#14204a,#0b1020 55%,#060a16);box-shadow:0 18px 40px -22px rgba(37,99,235,.7)}
.brandbar::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(201,211,224,.16) 1px,transparent 1.2px);background-size:16px 16px;mask-image:linear-gradient(180deg,#000,transparent 85%);-webkit-mask-image:linear-gradient(180deg,#000,transparent 85%);pointer-events:none}
.wordmark{background:var(--metal);-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700;font-size:1.75rem}
.wordmark .dot{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.wordmark small{-webkit-text-fill-color:#c9d3e0;color:#c9d3e0;opacity:.85}
.logo{filter:drop-shadow(0 6px 14px rgba(34,211,238,.35))}
.seg{background:rgba(255,255,255,.06);border-color:rgba(201,211,224,.18)}
.seg button.on{background:var(--grad);color:#fff}
.hello{color:#fff}
.strip div{background:rgba(255,255,255,.05);border-color:rgba(201,211,224,.14);backdrop-filter:blur(6px)}
.strip b{font-family:var(--num);font-weight:600;font-size:1.15rem}
.strip .m{background:var(--grad);border-color:transparent;color:#fff;box-shadow:0 8px 22px -8px rgba(34,211,238,.7)}
.amt,.tile .n,.onum,.stepper b,.pprice{font-family:var(--num);font-weight:600;letter-spacing:-.01em}
.amt{font-size:1.02rem}
.btn.sf{background:var(--grad);border:0;color:#fff;box-shadow:0 10px 26px -10px rgba(37,99,235,.75)}
.btn.dark{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri{background:var(--accent);border-color:var(--accent)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.chip.on b{background:var(--grad);color:#fff}
.sec .n{background:var(--grad);color:#fff}
.sum{background:radial-gradient(90% 120% at 100% 0%,rgba(34,211,238,.22),transparent 60%),linear-gradient(160deg,#14204a,#0b1020);color:#eef3fb}

function renderActions(o){
  if(S.role==="staff") return "";
  const A=[], s=o.status;
  if(s==="new") A.push(["picked","استلمت الطلب من المحل","check","dark big"]);
  if(s==="picked") A.push(["onway","انطلقت للزبون","bike","dark big"]);
  if(s==="onway"||s==="picked"){ A.push(["delivered","تم التسليم","check","sf big"]); A.push(["postponed","تأجيل","pause","ghost"]); A.push(["returned","مرتجع","back","ghost"]); }
  if(s==="postponed"){ A.push(["onway","في الطريق مرة ثانية","bike","dark big"]); A.push(["returned","مرتجع","back","ghost"]); }
  if(S.role==="seller"){
    if(s==="returned"||s==="cancelled"||s==="delivered") A.push(["new","إعادة فتح الطلب","back","ghost"]);
    if(ACTIVE.includes(s)) A.push(["cancelled","إلغاء الطلب","x","danger"]);
  }
  if(!A.length) return "";
  const big=A.filter(a=>a[3].includes("big")), small=A.filter(a=>!a[3].includes("big"));
  const b=a=>'<button type="button" class="btn '+a[3]+'" data-status="'+o.id+'" data-to="'+a[0]+'">'+I(a[2])+a[1]+'</button>';
  return big.map(b).join("")+(small.length?'<div class="row">'+small.map(b).join("")+'</div>':"");
}

async function changeStatus(id,to,note){
  const o=S.orders.find(x=>x.id===id); if(!o) return;
  const by = S.role==="seller" ? "الإدارة" : S.role==="staff" ? (S.auth.name||"") : dShort(S.driverId);
  const n=Object.assign({},o); delete n.id;
  n.status=to; n.updatedAt=Date.now();
  if(to==="delivered") n.deliveredAt=Date.now();
  if(to==="new"){ n.settled=false; }
  if(note!==undefined) n.driverNote=note;
  n.history=(o.history||[]).concat([{s:to,t:Date.now(),by}]).slice(-30);
  if(await safe(()=>store.setOrder(id,n))) toast("تم: "+STATUS[to].t);
}

document.addEventListener("click",async e=>{
  const b=e.target.closest("button,a"); if(!b) return;
  const D=b.dataset;
  if(D.role){ if(D.role==="driver"&&S.isOwner) S.driverId=null; S.role=D.role; S.tab="orders"; S.filter="active"; render(); return; }
  if(D.tab){ if(D.tab!=="new"&&S.tab==="new"&&!S.editId){} if(D.tab==="settings"){S.setAreas=null;} S.prodEdit=null; S.tab=D.tab; if(D.filter) S.filter=D.filter; S.confirmSettle=false; render(); window.scrollTo(0,0); return; }
  if(D.filter){ S.filter=D.filter; render(); return; }
  if(D.open){ S.open = S.open===D.open?null:D.open; S.noteFor=null; S.confirmDel=null; render(); return; }
  if(D.status){
    if(D.to==="delivered"){ S.deliverFor=D.status; S.open=D.status; S.dv={pm:null,task:"",note:"",shop:"",amount:null,img:null}; render(); const el=document.getElementById("dv_box"); if(el) el.scrollIntoView({block:"center",behavior:"smooth"}); return; }
    if(D.to==="postponed"||D.to==="returned"){ S.noteFor=D.status; S.noteTo=D.to; render(); const t=$("#noteIn"); if(t) t.focus(); return; }
    changeStatus(D.status,D.to); return;
  }
  if(D.pm){ syncDv(); S.dv.pm=D.pm; render(); return; }
  if(D.dvcancel){ S.deliverFor=null; S.dv=null; render(); return; }
  if(D.dvimgclear){ syncDv(); S.dv.img=null; render(); return; }
  if(D.dvok){
    syncDv(); const id=D.dvok, v=S.dv, o=S.orders.find(x=>x.id===id); if(!o||S.dvBusy) return;
    if(!v.pm){ toast("اختار وين حوّلت المبلغ"); return; }
    if(v.pm!=="cash" && !String(v.shop||"").trim()){ toast("اكتب اسم المحل اللي حوّلت منه"); return; }
    S.dvBusy=true; render();
    let ok=true;
    if(v.img) ok=await safe(()=>store.setReceipt(id,{img:v.img,t:Date.now(),num:o.num}));
    if(ok){
      const n=Object.assign({},o); delete n.id;
      n.status="delivered"; n.deliveredAt=Date.now(); n.updatedAt=Date.now();
      n.payMethod=v.pm; n.taskNote=(v.task||"").trim(); n.deliverNote=(v.note||"").trim(); n.hasReceipt=!!v.img;
      if(v.pm!=="cash"){ n.transferShop=String(v.shop||"").trim(); n.transferAmount=v.amount==null||v.amount===""?(calc(o).collect-calc(o).fee):num(v.amount); } else { n.transferShop=""; n.transferAmount=0; }
      n.history=(o.history||[]).concat([{s:"delivered",t:Date.now(),by:S.role==="seller"?"الإدارة":dShort(S.driverId)}]).slice(-30);
      ok=await safe(()=>store.setOrder(id,n));
    }
    S.dvBusy=false;
    if(ok){ S.deliverFor=null; S.dv=null; toast("تم تسليم الطلب #"+o.num); }
    render(); return;
  }
  if(D.receipt){
    S.viewR={loading:true}; renderModal();
    try{ const r=await store.getReceipt(D.receipt); S.viewR=r&&r.img?{img:r.img}:{err:"ما في صورة محفوظة لهذا الطلب"}; }catch(err){ S.viewR={err:"تعذر تحميل الصورة"}; }
    renderModal(); return;
  }
  if(D.closemodal){ S.viewR=null; renderModal(); return; }
  if(D.lockout){ logout(); return; }
  if(D.confirm){ const note=($("#noteIn")||{}).value||""; const id=D.confirm, to=S.noteTo; S.noteFor=null; changeStatus(id,to,note.trim()); return; }
  if(D.cancelnote){ S.noteFor=null; render(); return; }
  if(D.copy){ const o=S.orders.find(x=>x.id===D.copy); try{ await navigator.clipboard.writeText(orderText(o)); toast("تم نسخ تفاصيل الطلب"); }catch(err){ toast("لم يسمح المتصفح بالنسخ"); } return; }
  if(D.edit){ const o=S.orders.find(x=>x.id===D.edit); S.editId=o.id; S.draft=JSON.parse(JSON.stringify(o)); delete S.draft.id; S.tab="new"; render(); window.scrollTo(0,0); return; }
  if(D.canceledit){ S.editId=null; S.draft=blankDraft(); S.tab="orders"; render(); return; }
  if(D.del){ S.confirmDel=D.del; render(); return; }
  if(D.delno){ S.confirmDel=null; render(); return; }
  if(D.delyes){ const id=D.delyes; S.confirmDel=null; S.open=null; if(await safe(()=>store.delOrder(id))) toast("تم حذف الطلب"); return; }
  if(D.additem){ syncDraft(); S.draft.items.push({name:"",qty:1,price:""}); render(); const i=S.draft.items.length-1; const el=$("#it_n_"+i); if(el) el.focus(); return; }
  if(D.rmitem){ syncDraft(); S.draft.items.splice(+D.rmitem,1); render(); return; }
  if(D.addar){ syncSettingsLists(); S.setAreas.push({name:"",fee:""}); render(); return; }
  if(D.rmar){ syncSettingsLists(); S.setAreas.splice(+D.rmar,1); render(); return; }
  if(D.dsel){ if(S.auth&&S.isOwner){ loginDriver(D.dsel); return; } S.dgSel=D.dsel; S.gateErr=""; render(); return; }
  if(D.dlogout){ if(S.isOwner){ S.driverId=null; render(); } else logout(); return; }
  if(D.reset){ S.resetMode=!S.resetMode; S.gateErr=""; render(); return; }
  if(D.lmode){ S.lmode=D.lmode; S.dgSel=null; S.gateErr=""; render(); return; }
  if(D.retry){ S.pubErr=""; S.pub=null; render(); await loadPublic(); render(); return; }
  if(D.accd){ S.accDriver=D.accd; S.confirmSettle=false; render(); return; }
  if(D.reassign){ const o=S.orders.find(x=>x.id===D.reassign); if(!o) return; const n=Object.assign({},o); delete n.id; n.driverId=b.dataset.toD; n.updatedAt=Date.now(); if(await safe(()=>store.setOrder(o.id,n))) toast("تم تحويل الطلب لـ "+dShort(n.driverId)); return; }
  if(D.area){ syncDraft(); const a=areas().find(x=>x.name===D.area); if(a){ S.draft.area=a.name; S.draft.fee=a.fee; if(S.draft.feeOnCustomer===undefined) S.draft.feeOnCustomer=!S.settings.feeIncluded; } render(); return; }
  if(D.pick){ syncDraft(); const p=products().find(x=>x.id===D.pick); if(!p) return; const it=S.draft.items.find(i=>i.pid===p.id); if(it) it.qty=num(it.qty)+1; else S.draft.items.push({pid:p.id,name:p.name+(p.unit?" ("+p.unit+")":""),qty:1,price:unitPrice(p,S.draft.wholesale)}); render(); return; }
  if(D.wmode!==undefined){ syncDraft(); S.draft.wholesale=D.wmode==="1"; S.draft.items.forEach(it=>{ const p=products().find(x=>x.id===it.pid); if(p) it.price=unitPrice(p,S.draft.wholesale); }); render(); return; }
  if(D.dec){ syncDraft(); const k=S.draft.items.findIndex(i=>i.pid===D.dec); if(k>=0){ const it=S.draft.items[k]; it.qty=num(it.qty)-1; if(it.qty<=0) S.draft.items.splice(k,1); } render(); return; }
  if(D.pedit){ S.prodEdit=D.pedit; S.prodImg=undefined; render(); window.scrollTo(0,0); return; }
  if(D.pcancel){ S.prodEdit=null; S.prodImg=undefined; render(); return; }
  if(D.pimgclear){ S.prodImg=null; render(); return; }
  if(D.pavail){ const p=products().find(x=>x.id===D.pavail); if(!p) return; const b=prodBody(p); b.available=p.available===false; if(await safe(()=>store.setProduct(p.id,b))) toast(b.available?"الصنف متوفر":"تم تعليمه: نفد"); return; }
  if(D.pdel){ if(S.confirmP!==D.pdel){ S.confirmP=D.pdel; toast("اضغط حذف مرة ثانية للتأكيد"); return; } S.confirmP=null; const id=D.pdel; if(await safe(()=>store.delProduct(id))) toast("تم حذف الصنف"); return; }
  if(D.copyacc){
    const open=accOrders();
    const col=open.reduce((s,o)=>s+calc(o).collect,0), fee=open.reduce((s,o)=>s+calc(o).fee,0), tr=open.reduce((s,o)=>s+paidIn(o),0), net=col-fee-tr;
    const t=["كشف حساب الكابتن "+dName(S.role==="seller"?S.accDriver:S.driverId),new Date().toLocaleDateString("ar-EG"),""].concat(open.map(o=>"#"+o.num+" "+o.customer+": "+money(calc(o).collect)+" / أجرة "+money(calc(o).fee)+" / "+(PM[o.payMethod||"cash"])+(paidIn(o)?" "+money(paidIn(o)):""))).concat(["","المحصّل: "+money(col),"الأجرة: "+money(fee),"المحوّل للمحل: "+money(tr),(net>=0?"المتبقي على الكابتن: ":"المتبقي للكابتن: ")+money(Math.abs(net))]).join("\n");
    try{ await navigator.clipboard.writeText(t); toast("تم نسخ كشف الحساب"); }catch(err){ toast("لم يسمح المتصفح بالنسخ"); }
    return;
  }
  if(D.settle){ S.confirmSettle=true; render(); return; }
  if(D.settleno){ S.confirmSettle=false; render(); return; }
  if(D.settleyes){
    S.confirmSettle=false;
    const open=accOrders();
    for(const o of open){ const n=Object.assign({},o); delete n.id; n.settled=true; n.settledAt=Date.now(); if(!(await safe(()=>store.setOrder(o.id,n)))) return; }
    toast("تم تسجيل المحاسبة"); return;
  }
});

function syncDv(){ if(!S.dv) return; const g=id=>document.getElementById(id); if(g("dv_task")) S.dv.task=g("dv_task").value; if(g("dv_note")) S.dv.note=g("dv_note").value; if(g("dv_shop")) S.dv.shop=g("dv_shop").value; if(g("dv_amt")) S.dv.amount=g("dv_amt").value; }
function renderModal(){
  let host=document.getElementById("modal"); if(!host){ host=document.createElement("div"); host.id="modal"; document.body.appendChild(host); }
  const v=S.viewR;
  if(!v){ host.innerHTML=""; return; }
  host.innerHTML='<div class="modal" role="dialog" aria-label="صورة الإشعار"><div class="mbox"><div class="mhead"><b>صورة الإشعار</b><button type="button" class="btn ghost" data-closemodal="1" aria-label="إغلاق">'+I("x")+'</button></div>'+(v.loading?'<p class="hint">جارِ التحميل…</p>':v.err?'<p class="hint">'+esc(v.err)+'</p>':'<img src="'+v.img+'" alt="صورة الإشعار">')+'</div></div>';
}
function syncDraft(){
  const d=S.draft; if(!d) return;
  document.querySelectorAll("[data-f]").forEach(el=>{ d[el.dataset.f] = el.type==="checkbox"?el.checked:el.value; });
  document.querySelectorAll("[data-it]").forEach(el=>{ const it=d.items[+el.dataset.it]; if(it) it[el.dataset.k]=el.value; });
}
function syncSettingsLists(){
  document.querySelectorAll("[data-ar]").forEach(el=>{ const a=S.setAreas[+el.dataset.ar]; if(a) a[el.dataset.k]=el.value; });

}

document.addEventListener("input",e=>{
  const el=e.target;
  if(el.id==="search"){ S.q=el.value; const pos=el.selectionStart; render(); const s=$("#search"); if(s){ s.focus(); try{s.setSelectionRange(pos,pos);}catch(x){} } return; }
  if(el.dataset.f||el.dataset.it){
    syncDraft();
    if(el.dataset.it && el.dataset.k==="name"){
      const p=products().find(x=>x.name===el.value.trim());
      const it=S.draft.items[+el.dataset.it];
      if(p && it && !num(it.price)){ it.price=p.price; const pi=$("#it_p_"+el.dataset.it); if(pi) pi.value=p.price; }
    }
    const ls=$("#liveSum"); if(ls) ls.innerHTML=sumHtml(calc(S.draft));
  }
});
document.addEventListener("change",async e=>{
  const el=e.target;
  if(el.id==="dv_img" && el.files && el.files[0]){
    syncDv();
    try{ S.dv.img=await shrinkReceipt(el.files[0]); }catch(err){ toast("ما قدرت أقرأ الصورة، جرّب مرة ثانية"); return; }
    render(); return;
  }
  if(el.id==="p_img" && el.files && el.files[0]){
    const keep={n:($("#p_name")||{}).value,p:($("#p_price")||{}).value,u:($("#p_unit")||{}).value,w:($("#p_wprice")||{}).value};
    try{ S.prodImg=await shrinkImage(el.files[0]); }catch(err){ toast("ما قدرت أقرأ الصورة، جرّب صورة ثانية"); return; }
    render(); if($("#p_name")){ $("#p_name").value=keep.n||""; $("#p_price").value=keep.p||""; $("#p_unit").value=keep.u||""; $("#p_wprice").value=keep.w||""; }
    return;
  }
  if(el.id==="f_area"){
    syncDraft();
    const a=areas().find(x=>x.name===el.value);
    if(a){ S.draft.fee=a.fee; const f=$("#f_fee"); if(f) f.value=a.fee; }
    const ls=$("#liveSum"); if(ls) ls.innerHTML=sumHtml(calc(S.draft));
  }
  if(el.dataset.f==="payment"||el.dataset.f==="feeOnCustomer"){ syncDraft(); const ls=$("#liveSum"); if(ls) ls.innerHTML=sumHtml(calc(S.draft)); }
});

document.addEventListener("submit",async e=>{
  e.preventDefault();
  if(e.target.id==="orderForm"){
    syncDraft();
    const d=S.draft;
    d.items=d.items.filter(i=>String(i.name).trim());
    d.customer=String(d.customer||"").trim(); d.phone=String(d.phone||"").trim();
    d.address=String(d.address||"").trim(); d.notes=String(d.notes||"").trim();
    if(!d.customer||!d.phone){ toast("اكتب اسم الزبون ورقم الجوال"); render(); return; }
    if(!d.area){ toast("اختر المنطقة"); render(); return; }
    d.wholesale=!!d.wholesale;
    if(!d.items.length){ toast("اختر صنف واحد على الأقل"); render(); return; }
    d.items=d.items.map(i=>Object.assign(i.pid?{pid:i.pid}:{},{name:String(i.name).trim(),qty:num(i.qty)||1,price:num(i.price)}));
    d.fee=num(d.fee);
    const now=Date.now();
    let ok;
    if(S.editId){
      const old=S.orders.find(x=>x.id===S.editId)||{};
      const n=Object.assign({},old,d,{updatedAt:now}); delete n.id;
      if(old.area!==d.area || !n.driverId){ const dd=driverFor(d.area); n.driverId=dd?dd.id:""; }
      ok=await safe(()=>store.setOrder(S.editId,n));
      if(ok){ toast("تم حفظ التعديلات"); S.open=S.editId; }
    } else {
      const dd=driverFor(d.area);
      const n=Object.assign({},d,{num:nextNum(),status:"new",createdAt:now,updatedAt:now,settled:false,driverId:dd?dd.id:"",history:[{s:"new",t:now,by:S.role==="staff"?(S.auth.name||""):"الإدارة"}]});
      let newId=null;
      ok=await safe(async()=>{ newId=await store.addOrder(n); });
      if(ok){ toast("تم حفظ الطلب #"+(S.lastNum||n.num)+"، ابعثه للدليفري"); S.open=newId; }
    }
    if(ok){ S.editId=null; S.draft=blankDraft(); S.tab="orders"; S.filter="active"; render(); window.scrollTo(0,0); }
    return;
  }
  if(e.target.id==="dgForm"){
    if(S.busy) return; S.busy=true; render();
    try{ const r=await api("/login",{method:"POST",body:(S.lmode==="staff")?{role:"staff",staffId:S.dgSel,pin:e.target.pin.value}:{role:"driver",driverId:S.dgSel,pin:e.target.pin.value},noLogout:true}); S.busy=false; await afterLogin(r); }
    catch(err){ S.busy=false; S.gateErr=err.message; render(); }
    return;
  }
  if(e.target.id==="gateForm"){
    const f=e.target, pw=f.pw.value;
    if(S.busy) return;
    const setupMode=!S.pub.adminSet||S.resetMode;
    if(setupMode){
      if(pw.length<4){ S.gateErr="كلمة السر لازم تكون 4 أحرف أو أرقام على الأقل"; render(); return; }
      if(pw!==f.pw2.value){ S.gateErr="كلمتين السر مش متطابقات"; render(); return; }
    }
    S.busy=true; render();
    try{ const r=await api(setupMode?"/setup":"/login",{method:"POST",body:setupMode?{password:pw,reset:!!S.resetMode}:{role:"admin",password:pw},noLogout:true}); S.busy=false; S.resetMode=false; await afterLogin(r); toast("أهلاً فيك"); }
    catch(err){ S.busy=false; S.gateErr=err.message; render(); }
    return;
  }
  if(e.target.id==="drvForm"){
    const f=e.target; const list=drivers().map(x=>Object.assign({},x)); const pins=[];
    for(const d of list){
      d.name=f["dn_"+d.id].value.trim(); d.short=f["ds_"+d.id].value.trim(); d.phone=f["dp_"+d.id].value.trim(); d.zone=f["dz_"+d.id].value;
      const pin=f["dpin_"+d.id].value.trim(); if(pin) pins.push([d.id,pin]);
      delete d.hasPin;
    }
    for(const [id,pin] of pins){ if(pin.length<4){ toast("الرقم السري لازم يكون 4 أرقام على الأقل"); return; } }
    const s=Object.assign({},S.settings,{drivers:list});
    if(!(await safe(()=>store.saveSettings(s)))) return;
    for(const [id,pin] of pins){ if(!(await safe(()=>api("/driver-pin",{method:"PUT",body:{driverId:id,pin}})))) return; }
    await store.refresh(); toast(pins.length?"تم حفظ البيانات والأرقام السرية":"تم حفظ بيانات الدليفري"); render();
    return;
  }
  if(e.target.id==="stfForm"){
    const f=e.target; const list=(S.settings.staff||[]).map(x=>Object.assign({},x)); const pins=[];
    for(const d of list){ d.name=f["sn_"+d.id].value.trim(); const pin=f["spin_"+d.id].value.trim(); if(pin) pins.push([d.id,pin]); delete d.hasPin; }
    for(const [id,pin] of pins){ if(pin.length<4){ toast("الرقم السري لازم يكون 4 أرقام على الأقل"); return; } }
    const s=Object.assign({},S.settings,{staff:list});
    if(!(await safe(()=>store.saveSettings(s)))) return;
    for(const [id,pin] of pins){ if(!(await safe(()=>api("/driver-pin",{method:"PUT",body:{staffId:id,pin}})))) return; }
    await store.refresh(); toast(pins.length?"تم حفظ الأسماء والأرقام السرية":"تم الحفظ"); render();
    return;
  }
  if(e.target.id==="pwForm"){
    const f=e.target, oldp=f.oldpw.value, np=f.newpw.value;
    if(np.length<4){ toast("كلمة السر الجديدة قصيرة"); return; }
    try{ const r=await api("/admin-password",{method:"PUT",body:{old:oldp,password:np},noLogout:true}); tokSet(r.token); f.reset(); toast("تم تغيير كلمة السر"); }
    catch(err){ toast(err.message); }
    return;
  }
  if(e.target.id==="prodForm"){
    const f=e.target, name=f.pname.value.trim(), price=num(f.pprice.value), unit=f.punit.value.trim(), wprice=num(f.pwprice.value);
    if(!name){ toast("اكتب اسم الصنف"); return; }
    const was=S.prodEdit;
    let ok;
    if(was){
      const old=products().find(x=>x.id===was)||{};
      const b=Object.assign(prodBody(old),{name,price,wprice,unit,updatedAt:Date.now()});
      if(S.prodImg!==undefined){ if(S.prodImg) b.img=S.prodImg; else delete b.img; }
      ok=await safe(()=>store.setProduct(was,b));
    } else {
      const b={name,price,wprice,unit,available:true,order:products().length+1,createdAt:Date.now()};
      if(S.prodImg) b.img=S.prodImg;
      ok=await safe(()=>store.addProduct(b));
    }
    if(ok){ S.prodEdit=null; S.prodImg=undefined; render(); toast(was?"تم حفظ التعديل":"تمت إضافة "+name); }
    return;
  }
  if(e.target.id==="setForm"){
    syncSettingsLists();
    const f=e.target;
    const s=Object.assign({},S.settings,{
      adminName:f.adminName.value.trim(), storeName:f.storeName.value.trim(), storeTagline:f.storeTagline.value.trim(), driverName:f.driverName?f.driverName.value.trim():(S.settings.driverName||""),
      driverPhone:f.driverPhone?f.driverPhone.value.trim():(S.settings.driverPhone||""), countryCode:f.countryCode.value, feeIncluded:f.feeIncluded.checked,
      areas:S.setAreas.filter(a=>String(a.name).trim()).map(a=>({name:String(a.name).trim(),fee:num(a.fee)}))
    });
    if(await safe(()=>store.saveSettings(s))){ S.settings=s; S.setAreas=null; toast("تم حفظ الإعدادات"); render(); }
  }
});

/* ---------- boot ---------- */
function start(st){
  store=st;
  store.listen(orders=>{
    S.orders=orders;
    if(S.mode==="loading"){ S.mode="ready"; }
    if(!(S.tab==="new"||S.tab==="settings"||S.tab==="products")) render();
    else { const c=$("#tabs"); if(!c.innerHTML) render(); }
  }, settings=>{
    S.settings=settings||{};
    if(S.rememberDriver && !S.driverId){ const d=drv(S.rememberDriver[0]); if(d && (d.pin||"")===(S.rememberDriver[1]||"") && (d.pin||S.isOwner)) S.driverId=d.id; S.rememberDriver=null; }
    if(!(S.tab==="new"||S.tab==="settings"||S.tab==="products")) render();
  }, prods=>{
    S.prodList=prods||[];
    if(S.tab!=="settings" && !(S.tab==="new"&&document.activeElement&&document.activeElement.matches("input,textarea,select"))) render();
  });
  render();
}
render();
(async()=>{
  await loadPublic();
  if(tokGet()) await startSession(); else render();
})();
})();
</script>
</body>
