<style>
/* Layout: app shell — sticky top bar, one view at a time (catalog, course, checkout, player, my learning, certificate, admin). Dark MME identity. */
:root{
  --ink:#060A16;--navy:#0B1020;--slate:#1E293B;--slate2:#141C2E;
  --blue:#2563EB;--cyan:#22D3EE;--white:#FFFFFF;--silver:#C9D3E0;--text:#B9C4D4;--mute:#7E8BA2;
  --line:rgba(148,163,184,.14);--line2:rgba(148,163,184,.26);--glow:rgba(34,211,238,.35);
  --ok:#34d399;--warn:#fbbf24;
  --display:"Unbounded","Arial Black",system-ui,sans-serif;
  --body:"Readex Pro","Segoe UI",Tahoma,system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --grad:linear-gradient(90deg,var(--blue),var(--cyan));
  --gut:clamp(16px,4vw,40px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--ink)}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--body);font-size:15.5px;line-height:1.7;overflow-x:clip;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:6px}
.en{direction:ltr;unicode-bidi:isolate}
.mono{font-family:var(--mono);letter-spacing:.1em;text-transform:uppercase;font-size:11.5px}
.wrap{max-width:1180px;margin-inline:auto;padding-inline:var(--gut)}
.blue{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(6,10,22,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:14px;height:64px}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:700;color:var(--white);font-size:15px;letter-spacing:.06em}
.logo img{height:32px;width:auto;mix-blend-mode:screen;display:block}
.logo .ac-tag{font-family:var(--mono);font-weight:500;font-size:11px;letter-spacing:.18em;color:var(--cyan);padding:5px 9px;border:1px solid rgba(34,211,238,.4);border-radius:999px}
.nav{display:flex;gap:4px;margin-inline-start:auto;flex-wrap:wrap}
.nav button{padding:8px 12px;border-radius:10px;font-size:14px;color:var(--text)}
.nav button[aria-current=true]{background:var(--slate);color:var(--white)}
.nav .adm{color:var(--cyan)}

/* common */
main{padding-block:28px 80px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:46px;padding:12px 22px;border-radius:999px;font-weight:500;font-size:14.5px;transition:box-shadow .25s,background .25s,border-color .25s;text-decoration:none}
.btn-p{background:var(--blue);color:#fff;box-shadow:0 10px 30px -12px rgba(37,99,235,.9)}
.btn-p:hover{box-shadow:0 0 0 1px var(--cyan) inset,0 12px 34px -8px var(--glow)}
.btn-g{border:1px solid var(--line2);color:var(--white)}
.btn-g:hover{border-color:var(--cyan)}
.btn-s{min-height:36px;padding:7px 14px;font-size:13px}
.btn-d{border:1px solid rgba(248,113,113,.4);color:#fca5a5}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;border:1px solid var(--line2);font-size:12.5px;color:var(--silver);white-space:nowrap}
.chip.c{border-color:rgba(34,211,238,.4);color:var(--cyan)}
.chip.ok{border-color:rgba(52,211,153,.4);color:var(--ok)}
.chip.wa{border-color:rgba(251,191,36,.4);color:var(--warn)}
.card{border:1px solid var(--line);border-radius:20px;background:linear-gradient(160deg,var(--slate2),var(--navy))}
.h1{font-family:var(--display);font-weight:700;color:var(--white);font-size:clamp(1.7rem,4.6vw,3.1rem);line-height:1.08;margin:0;letter-spacing:-.01em;text-wrap:balance}
.h2{font-family:var(--display);font-weight:700;color:var(--white);font-size:clamp(1.15rem,2.4vw,1.6rem);margin:0;line-height:1.2}
.lead{margin:0;color:var(--silver);font-size:clamp(1rem,1.7vw,1.12rem);max-width:60ch}
.empty{padding:40px 24px;text-align:center;color:var(--mute);border:1px dashed var(--line2);border-radius:20px}
.empty b{display:block;color:var(--white);font-weight:500;font-size:17px;margin-bottom:6px}
.back{display:inline-flex;align-items:center;gap:8px;color:var(--mute);font-size:14px;margin-bottom:18px}
.back:hover{color:var(--white)}
.bar{height:6px;border-radius:6px;background:var(--slate);overflow:hidden}
.bar i{display:block;height:100%;background:var(--grad);border-radius:6px;transition:width .4s}
.toast{position:fixed;inset-inline:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));margin-inline:auto;width:max-content;max-width:calc(100% - 32px);padding:12px 18px;border-radius:14px;background:var(--slate);border:1px solid var(--line2);color:var(--white);z-index:50;font-size:14px}
.note{font-size:13px;color:var(--mute)}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:26px;padding:clamp(28px,5vw,56px);border:1px solid var(--line);background:radial-gradient(60% 80% at 100% 0%,rgba(34,211,238,.18),transparent 60%),radial-gradient(70% 90% at 0% 100%,rgba(37,99,235,.38),transparent 65%),var(--navy);display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:28px;align-items:end}
.hero .k{color:var(--cyan)}
.hero-logo{width:min(220px,55vw);height:auto;mix-blend-mode:screen;margin:-10px 0 -6px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{padding:16px;border-radius:16px;background:rgba(6,10,22,.55);border:1px solid var(--line)}
.stat b{display:block;font-family:var(--display);font-size:24px;color:var(--white);font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--mute)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:28px 0 18px}
.filters button{padding:8px 15px;border-radius:999px;border:1px solid var(--line2);font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;color:var(--silver)}
.filters button[aria-pressed=true]{background:var(--blue);border-color:var(--blue);color:#fff}

/* course grid */
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.cc{display:flex;flex-direction:column;overflow:hidden;text-align:start;transition:transform .35s,border-color .35s,box-shadow .35s;min-width:0}
.cc:hover{transform:translateY(-4px);border-color:rgba(34,211,238,.4);box-shadow:0 22px 44px -26px rgba(37,99,235,.9)}
.cover{position:relative;height:150px;padding:18px;display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(80% 100% at 100% 0%,rgba(34,211,238,.3),transparent 60%),radial-gradient(90% 120% at 0% 100%,rgba(37,99,235,.6),transparent 65%),#0f1a38;border-bottom:1px solid var(--line)}
.cover .tr{font-family:var(--display);font-weight:700;font-size:22px;color:#fff;letter-spacing:.02em}
.cover .gh{position:absolute;inset-inline-end:12px;bottom:-14px;font-family:var(--display);font-weight:700;font-size:86px;line-height:1;color:transparent;-webkit-text-stroke:1px rgba(255,255,255,.18)}
.cc .bd{padding:18px;display:flex;flex-direction:column;gap:10px;flex:1}
.cc h3{margin:0;color:var(--white);font-size:17.5px;font-weight:600;line-height:1.45}
.cc .meta{display:flex;gap:6px;flex-wrap:wrap}
.cc .ft{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;padding-top:12px;border-top:1px solid var(--line)}
.price{font-family:var(--display);font-weight:700;color:var(--white);font-size:19px}
.price small{font-family:var(--body);font-weight:400;font-size:12px;color:var(--mute)}

/* course page */
.cp{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:22px;align-items:start}
.curr{display:flex;flex-direction:column}
.ls{display:flex;align-items:center;gap:14px;padding:14px 4px;border-bottom:1px solid var(--line)}
.ls .n{font-family:var(--mono);font-size:12px;color:var(--mute);width:28px}
.ls .t{flex:1;color:var(--white);min-width:0}
.ls .d{font-size:12.5px;color:var(--mute);white-space:nowrap}
.side{position:sticky;top:84px;padding:22px;display:flex;flex-direction:column;gap:14px}
.side ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px;font-size:14px}
.side li::before{content:"✓";color:var(--cyan);margin-inline-end:8px}

/* checkout */
.co{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;align-items:start}
.pm{display:flex;flex-direction:column;gap:10px}
.pm label{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--line2);border-radius:14px;opacity:.55}
.pm label b{color:var(--white);font-weight:500}
.fld{display:flex;flex-direction:column;gap:6px;min-width:0}
.fld label{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
.fld input,.fld select,.fld textarea{width:100%;color:var(--white);background:var(--ink);border:1px solid var(--line2);border-radius:12px;padding:11px 13px;font-size:15px}
.fld textarea{min-height:80px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--cyan)}

/* player */
.pl{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
.screen{aspect-ratio:16/9;max-width:100%;border-radius:20px;overflow:hidden;background:#000;border:1px solid var(--line2);display:grid;place-items:center}
.screen video{width:100%;height:100%;display:block;background:#000}
.screen{position:relative;user-select:none;-webkit-user-select:none}
.wm{position:absolute;inset-inline-end:14px;top:12px;font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:rgba(255,255,255,.35);pointer-events:none}
.screen .ph{text-align:center;padding:20px;color:var(--mute)}
.screen .ph b{display:block;font-family:var(--display);color:var(--white);font-size:18px;margin-bottom:6px}
.lessons{padding:8px;max-height:70vh;overflow:auto}
.lb{width:100%;display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;text-align:start}
.lb:hover{background:rgba(37,99,235,.1)}
.lb[aria-current=true]{background:rgba(37,99,235,.2)}
.lb .ck{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line2);display:grid;place-items:center;flex-shrink:0;font-size:12px}
.lb.done .ck{background:var(--cyan);border-color:var(--cyan);color:#06202a}
.lb .t{flex:1;min-width:0;color:var(--white);font-size:14.5px}
.lb .d{font-size:12px;color:var(--mute)}

/* my learning */
.ml{display:flex;flex-direction:column;gap:12px}
.mi{display:grid;grid-template-columns:minmax(0,1fr) 220px auto;gap:18px;align-items:center;padding:18px 20px}

/* certificate */
.cert-wrap{max-width:920px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
.cert{width:100%;height:auto;display:block;border-radius:16px;box-shadow:0 30px 70px -30px rgba(37,99,235,.8)}

/* admin */
.tabs{display:flex;gap:6px;margin:18px 0;flex-wrap:wrap}
.tabs button{padding:9px 16px;border-radius:12px;border:1px solid var(--line2);font-size:14px}
.tabs button[aria-pressed=true]{background:var(--slate);border-color:var(--cyan);color:#fff}
.tbl{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
.tbl th{text-align:start;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;color:var(--mute);font-weight:400;padding:10px 12px;border-bottom:1px solid var(--line2)}
.tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:middle;color:var(--silver)}
.tbl td b{color:var(--white);font-weight:500}
.scroll{overflow-x:auto}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form .w{grid-column:1/-1}
.lrow{display:grid;grid-template-columns:28px minmax(0,1fr) 90px auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.lrow input{width:100%;color:var(--white);background:var(--ink);border:1px solid var(--line2);border-radius:10px;padding:8px 10px;font-size:14px}
.lsub{grid-column:1/-1;display:flex;flex-direction:column;gap:8px;padding:4px 0 6px}
.lsub textarea{width:100%;min-height:60px;resize:vertical;color:var(--white);background:var(--ink);border:1px solid var(--line2);border-radius:10px;padding:8px 10px;font-size:14px}
.files{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fchip{display:inline-flex;align-items:center;gap:6px;padding:5px 6px 5px 11px;border-radius:999px;background:var(--slate);font-size:12.5px;color:var(--silver);max-width:100%}
.fchip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fchip button{width:22px;height:22px;border-radius:50%;color:#fca5a5}
.mat{display:flex;flex-direction:column;gap:10px;padding:18px 20px}
.mat .row{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:rgba(6,10,22,.5)}
.mat .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:rgba(37,99,235,.18);border:1px solid rgba(37,99,235,.4);font-family:var(--mono);font-size:10px;color:var(--cyan);flex-shrink:0}
.mat .nm{flex:1;min-width:0;color:var(--white);overflow-wrap:anywhere;font-size:14.5px}
.mat .sz{font-size:12px;color:var(--mute)}
.notes{white-space:pre-line;color:var(--silver);margin:0}
.vid{font-size:12px;color:var(--mute);white-space:nowrap}
.vid.y{color:var(--ok)}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer}
.switch input{width:18px;height:18px;accent-color:var(--blue)}

@media (max-width:960px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cp,.co,.pl,.hero{grid-template-columns:minmax(0,1fr)}
  .side{position:static}
  .lessons{max-height:none}
}
@media (max-width:640px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .nav button{padding:7px 9px;font-size:13px}
  .logo .ac-tag{display:none}
  .mi{grid-template-columns:minmax(0,1fr)}
  .form{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .lrow{grid-template-columns:22px minmax(0,1fr) 64px;grid-auto-rows:auto}
  .lrow .x{grid-column:2/-1;display:flex;gap:8px;flex-wrap:wrap}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
(function(){

function toast(msg){const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}
function money(p){return p>0?'$'+Number(p).toLocaleString('en-US'):'مجانية'}
function mins(c){return (c.lessons||[]).reduce((a,l)=>a+(+l.minutes||0),0)}
function course(id){return S.courses.find(c=>c.id===id)}
function status(cid){return S.myOrder&&S.myOrder.courses&&S.myOrder.courses[cid]?S.myOrder.courses[cid].status:null}
function done(cid){return (S.progress[cid]&&S.progress[cid].done)||[]}
function pct(c){const n=(c.lessons||[]).length;if(!n)return 0;const d=done(c.id).filter(id=>c.lessons.some(l=>l.id===id)).length;return Math.round(d/n*100)}
function visible(){return S.courses.filter(c=>c.published||S.canEdit).sort((a,b)=>(a.order||0)-(b.order||0))}
function go(view,o){Object.assign(S,{view},o||{});render();window.scrollTo({top:0,behavior:'auto'})}

/* ---------- NAV ---------- */
function renderNav(){
  const items=[['catalog','الدورات'],['mine','دوراتي']];

}

function cardHTML(c){
  const st=status(c.id),p=pct(c);
  const badge=st==='active'?`<span class="chip ok">مسجّل · ${p}%</span>`:st==='pending'?`<span class="chip wa">بانتظار الدفع</span>`:'';
  return `<button class="card cc" type="button" data-open="${esc(c.id)}">
    <div class="cover"><span class="mono" style="color:#cfe9ff">${esc(c.track||'')}</span><span class="tr en">${esc(c.titleEn||'')}</span><span class="gh en" aria-hidden="true">${String((c.order||0)).padStart(2,'0')}</span></div>
    <div class="bd">
      <h3>${esc(c.titleAr)}</h3>
      <div class="meta"><span class="chip">${LEVELS[c.level]||'مبتدئ'}</span><span class="chip">${(c.lessons||[]).length} دروس</span><span class="chip">${Math.round(mins(c))} دقيقة</span>${!c.published?'<span class="chip wa">مسودة</span>':''}${c.sample&&S.canEdit?'<span class="chip c">مثال</span>':''}</div>
      <div class="ft"><span class="price en">${money(c.price)}</span>${badge||'<span class="chip c">عرض الدورة ←</span>'}</div>
    </div></button>`;
}
function vCourse(){
  const c=course(S.cid);if(!c)return notFound();
  const st=status(c.id);
  let cta;
  if(st==='active')cta=`<button class="btn btn-p" type="button" data-learn="${esc(c.id)}">${pct(c)>0?'تابع التعلّم':'ابدأ التعلّم'}</button>`;
  else if(st==='pending')cta=`<span class="chip wa" style="align-self:flex-start">طلبك بانتظار تأكيد الدفع</span><a class="btn btn-g" href="${waLink(c)}" target="_blank" rel="noopener">تواصل معنا عبر واتساب</a>`;
  else cta=`<button class="btn btn-p" type="button" data-checkout="${esc(c.id)}">${c.price>0?'سجّل الآن':'سجّل مجانًا'}</button>`;
  return `<button class="back" type="button" data-go="catalog">→ كل الدورات</button>
  <div class="cp">

function vLearn(){

function vCert(){
  const c=course(S.cid);if(!c)return notFound();
  if(pct(c)<100)return `<div class="empty"><b>الشهادة تظهر بعد إكمال كل الدروس</b><button class="btn btn-p" type="button" data-learn="${esc(c.id)}" style="margin-top:12px">تابع الدورة</button></div>`;
  return `<button class="back" type="button" data-go="mine">→ دوراتي</button><div class="cert-wrap">${certSVG(c)}
  <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">${S.downloads?`<button class="btn btn-p" type="button" data-dlcert="${esc(c.id)}">تحميل الشهادة</button>`:''}<button class="btn btn-g" type="button" data-learn="${esc(c.id)}">رجوع للدورة</button></div></div>`;
}
function notFound(){return `<div class="empty"><b>هذه الدورة غير متاحة</b><button class="btn btn-p" type="button" data-go="catalog" style="margin-top:12px">كل الدورات</button></div>`}

/* ---------- ADMIN ---------- */
function vAdmin(){
  if(!S.canEdit)return `<div class="empty"><b>لوحة التحكم للمشرفين فقط</b></div>`;
  const pend=S.orders.reduce((a,o)=>a+Object.values(o.courses||{}).filter(x=>x.status==='pending').length,0);
  let h=`<h1 class="h1"><span class="en">ADMIN</span></h1><p class="lead">إدارة الدورات والدروس والطلاب.</p>
  <div class="tabs" role="group"><button type="button" data-atab="courses" aria-pressed="${S.adminTab==='courses'}">الدورات (${S.courses.length})</button><button type="button" data-atab="orders" aria-pressed="${S.adminTab==='orders'}">الطلاب والطلبات ${pend?`<span class="chip wa" style="margin-inline-start:6px">${pend} بانتظار</span>`:''}</button></div>`;
  if(S.edit)return h+adminForm();
  if(S.adminTab==='orders')return h+adminOrders();
  return h+`<div style="display:flex;justify-content:flex-end;margin-bottom:12px"><button class="btn btn-p" type="button" data-new>+ دورة جديدة</button></div>`+
  (S.courses.length?`<div class="card scroll"><table class="tbl"><thead><tr><th>الدورة</th><th>المسار</th><th>السعر</th><th>الدروس</th><th>الحالة</th><th></th></tr></thead><tbody>${[...S.courses].sort((a,b)=>(a.order||0)-(b.order||0)).map(c=>`<tr><td><b>${esc(c.titleAr)}</b><div class="en note">${esc(c.titleEn||'')}</div></td><td class="en">${esc(c.track||'')}</td><td class="en">${money(c.price)}</td><td class="en">${(c.lessons||[]).length}</td><td>${c.published?'<span class="chip ok">منشورة</span>':'<span class="chip wa">مسودة</span>'}${c.sample?' <span class="chip c">مثال</span>':''}</td><td style="white-space:nowrap"><button class="btn btn-g btn-s" type="button" data-editc="${esc(c.id)}">تعديل</button> ${S.confirmDel===c.id?`<button class="btn btn-d btn-s" type="button" data-delc="${esc(c.id)}">تأكيد الحذف</button> <button class="btn btn-g btn-s" type="button" data-canceldel>إلغاء</button>`:`<button class="btn btn-d btn-s" type="button" data-askdel="${esc(c.id)}">حذف</button>`}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><b>لا توجد دورات بعد</b>أضف أول دورة بالزر أعلاه.</div>`);
}
function adminForm(){
  const e=S.edit;
  return `<form class="card" id="cForm" style="padding:24px;display:flex;flex-direction:column;gap:18px" novalidate>
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h2 class="h2">${e._new?'دورة جديدة':'تعديل الدورة'}</h2><label class="switch"><input type="checkbox" id="f-pub" ${e.published?'checked':''}> منشورة للطلاب</label></div>
    <div class="form">
      <div class="fld"><label for="f-tar">اسم الدورة بالعربي</label><input id="f-tar" value="${esc(e.titleAr)}" required></div>
      <div class="fld"><label for="f-ten">الاسم بالإنجليزي</label><input id="f-ten" dir="ltr" value="${esc(e.titleEn)}"></div>
      <div class="fld"><label for="f-tr">المسار</label><select id="f-tr">${TRACKS.slice(1).map(([k,a])=>`<option value="${k}" ${e.track===k?'selected':''}>${k} · ${a}</option>`).join('')}</select></div>
      <div class="fld"><label for="f-lv">المستوى</label><select id="f-lv">${Object.entries(LEVELS).map(([k,a])=>`<option value="${k}" ${e.level===k?'selected':''}>${a}</option>`).join('')}</select></div>
      <div class="fld"><label for="f-pr">السعر بالدولار (0 = مجانية)</label><input id="f-pr" type="number" min="0" step="1" dir="ltr" value="${+e.price||0}"></div>
      <div class="fld"><label for="f-or">الترتيب في الصفحة</label><input id="f-or" type="number" min="0" step="1" dir="ltr" value="${+e.order||0}"></div>
      <div class="fld w"><label for="f-ds">وصف الدورة</label><textarea id="f-ds">${esc(e.descAr)}</textarea></div>
    </div>
    <div>
      <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px"><b style="color:#fff">الدروس</b><button class="btn btn-g btn-s" type="button" data-addl>+ درس</button></div>
      <p class="note" style="margin:0 0 6px">لكل درس: العنوان والمدة وفيديو (حتى 20MB)، وملاحظات، ومواد مرفقة مثل PDF والصور والملفات النصية.</p>
      <div id="lrows">${e.lessons.map((l,i)=>`<div class="lrow">
        <span class="en note">${i+1}</span>
        <input data-lt="${i}" value="${esc(l.titleAr)}" placeholder="عنوان الدرس" aria-label="عنوان الدرس ${i+1}">
        <input data-lm="${i}" type="number" min="0" dir="ltr" value="${+l.minutes||0}" aria-label="المدة بالدقائق">
        <div class="x" style="display:contents">
        ${S.assets?`<label class="btn btn-g btn-s" style="cursor:pointer">${l.videoId?'تغيير الفيديو':'رفع فيديو'}<input type="file" accept="video/mp4,video/webm" data-lv="${i}" hidden></label>`:''}
        <span class="vid ${l.videoId?'y':''}">${l.videoId?'✓ فيديو':(l._up?'جارٍ الرفع…':'بدون فيديو')}</span>
        <button class="btn btn-d btn-s" type="button" data-rml="${i}" aria-label="حذف الدرس">×</button></div>
        <div class="lsub">
          <textarea data-ln="${i}" placeholder="ملاحظات الدرس أو ملخصه (اختياري)" aria-label="ملاحظات الدرس ${i+1}">${esc(l.notes||'')}</textarea>
          <div class="files">${(l.files||[]).map((f,j)=>`<span class="fchip"><span>${esc(f.name)}</span><button type="button" data-rmf="${i}|${j}" aria-label="حذف الملف">×</button></span>`).join('')}
          ${S.assets?`<label class="btn btn-g btn-s" style="cursor:pointer">+ مادة للدرس<input type="file" accept="application/pdf,image/*,text/plain,text/csv,text/markdown,.md,.csv,.txt" data-lf="${i}" hidden multiple></label>`:''}
          ${l._upf?'<span class="vid">جارٍ رفع الملف…</span>':''}</div>
        </div>
      </div>`).join('')||'<p class="note">لا دروس بعد.</p>'}</div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn btn-p" type="submit">حفظ الدورة</button><button class="btn btn-g" type="button" data-cancel>إلغاء</button></div>
  </form>`;
}
function adminOrders(){
  const rows=[];S.orders.forEach(o=>Object.entries(o.courses||{}).forEach(([cid,x])=>rows.push({u:o.id,name:o.name,phone:o.phone,cid,st:x.status,at:x.at})));
  rows.sort((a,b)=>(a.st==='pending'?0:1)-(b.st==='pending'?0:1)||(b.at||0)-(a.at||0));
  if(!rows.length)return `<div class="empty"><b>لا يوجد طلاب بعد</b>تظهر هنا طلبات التسجيل فور وصولها.</div>`;
  return `<div class="card scroll"><table class="tbl"><thead><tr><th>الطالب</th><th>الدورة</th><th>التاريخ</th><th>الحالة</th><th></th></tr></thead><tbody>${rows.map(r=>{const c=course(r.cid);return `<tr><td><b>${esc(r.name||'—')}</b><div class="en note">${esc(r.phone||'')}</div></td><td>${esc(c?c.titleAr:r.cid)}</td><td class="en note">${r.at?new Date(r.at).toLocaleDateString('en-GB'):''}</td><td>${r.st==='active'?'<span class="chip ok">مفعّلة</span>':'<span class="chip wa">بانتظار الدفع</span>'}</td><td>${r.st==='pending'?`<button class="btn btn-p btn-s" type="button" data-approve="${esc(r.u)}|${esc(r.cid)}">تأكيد الدفع وتفعيل</button>`:`<button class="btn btn-g btn-s" type="button" data-suspend="${esc(r.u)}|${esc(r.cid)}">إيقاف</button>`}</td></tr>`}).join('')}</tbody></table></div>`;
}

/* ---------- RENDER ---------- */
function render(){
  renderNav();
  const v={catalog:vCatalog,course:vCourse,checkout:vCheckout,learn:vLearn,mine:vMine,cert:vCert,admin:vAdmin}[S.view]||vCatalog;
  app.innerHTML=v();
}

/* ---------- ACTIONS ---------- */
async function enroll(c,name,phone){
  const cur=S.myOrder||{};
  const body={name,phone,courses:Object.assign({},cur.courses||{},{[c.id]:{status:c.price>0?'pending':'active',at:Date.now()}})};
  await S.db.doc('orders/'+S.uid).set(body);
  S.name=name;
}
async function toggleLesson(c,lid){
  const d=done(c.id).slice();const i=d.indexOf(lid);if(i>=0)d.splice(i,1);else d.push(lid);
  S.progress[c.id]={done:d};render();
  await S.db.doc('data/users/'+S.uid+'/'+c.id).set({done:d,at:Date.now()});
}
function readForm(){
  const e=S.edit;
  e.titleAr=$('#f-tar').value.trim();e.titleEn=$('#f-ten').value.trim();e.track=$('#f-tr').value;e.level=$('#f-lv').value;
  e.price=Math.max(0,+$('#f-pr').value||0);e.order=+$('#f-or').value||0;e.descAr=$('#f-ds').value;e.published=$('#f-pub').checked;
  document.querySelectorAll('[data-lt]').forEach(el=>{e.lessons[+el.dataset.lt].titleAr=el.value});
  document.querySelectorAll('[data-ln]').forEach(el=>{e.lessons[+el.dataset.ln].notes=el.value});
  document.querySelectorAll('[data-lm]').forEach(el=>{e.lessons[+el.dataset.lm].minutes=+el.value||0});
}
const rid=p=>p+'-'+Math.random().toString(36).slice(2,9);

app.addEventListener('click',async ev=>{
  const b=ev.target.closest('button,[data-open]');if(!b)return;
  const d=b.dataset;
  try{
    if(d.go)return go(d.go,{edit:null});
    if(d.track)return (S.track=d.track,render());
    if(d.open)return go('course',{cid:d.open});
    if(d.checkout)return go('checkout',{cid:d.checkout});
    if(d.learn){const c=course(d.learn);const nd=(c.lessons||[]).find(l=>!done(c.id).includes(l.id));return go('learn',{cid:d.learn,lid:nd?nd.id:(c.lessons[0]||{}).id})}
    if(d.lesson)return (S.lid=d.lesson,render(),window.scrollTo({top:0}));
    if(d.toggle)return toggleLesson(course(S.cid),d.toggle);
    if(d.cert)return go('cert',{cid:d.cert});
    if(d.dlcert){const svg=certSVG(course(d.dlcert)).replace(' class="cert" role="img" aria-label="شهادة إتمام"','');try{await S.downloads.save({filename:'MME-Academy-Certificate.svg',data:svg})}catch(e){if(e&&e.code!=='declined')toast('تعذّر التحميل في هذا العرض.')}return}
    if(d.atab)return (S.adminTab=d.atab,S.edit=null,render());
    if(d.new!==undefined){S.edit={_new:true,id:rid('c'),titleAr:'',titleEn:'',track:'MARKETING',level:'beginner',price:0,order:S.courses.length+1,descAr:'',published:false,lessons:[]};return render()}
    if(d.editc){const c=course(d.editc);S.edit=JSON.parse(JSON.stringify(Object.assign({lessons:[]},c)));return render()}
    if(d.cancel!==undefined)return (S.edit=null,render());
    if(d.addl!==undefined){readForm();S.edit.lessons.push({id:rid('l'),titleAr:'',minutes:10});return render()}
    if(d.rmf){readForm();const [i,j]=d.rmf.split('|').map(Number);S.edit.lessons[i].files.splice(j,1);return render()}
    if(d.dlf){const [id,...n]=d.dlf.split('|');const name=n.join('|');try{const r=await fetch('/_blob/'+id);const blob=await r.blob();await S.downloads.save({filename:name,data:blob})}catch(e){if(!e||e.code!=='declined')toast('تعذّر تحميل الملف.')}return}
    if(d.rml){readForm();S.edit.lessons.splice(+d.rml,1);return render()}
    if(d.askdel)return (S.confirmDel=d.askdel,render());
    if(d.canceldel!==undefined)return (S.confirmDel=null,render());
    if(d.delc){await S.db.doc('courses/'+d.delc).delete();S.confirmDel=null;toast('حُذفت الدورة');return}
    if(d.approve||d.suspend){const [u,cid]=(d.approve||d.suspend).split('|');await S.db.doc('orders/'+u).update({courses:{[cid]:{status:d.approve?'active':'pending',at:Date.now()}}});toast(d.approve?'فُعّلت الدورة للطالب':'أُوقفت الدورة');return}
  }catch(e){toast('تعذّر تنفيذ العملية، حاول مرة أخرى.')}
});
app.addEventListener('submit',async ev=>{
  ev.preventDefault();
  try{
    if(ev.target.id==='coForm'){
      const c=course(S.cid);const name=$('#co-name').value.trim();const phone=$('#co-phone').value.trim();
      if(!name){$('#co-name').focus();toast('اكتب اسمك كما تريده على الشهادة');return}
      await enroll(c,name,phone);
      if(c.price>0){toast('وصلنا طلبك. أكّد الدفع عبر واتساب لتفعيل الدورة.');go('mine')}
      else{toast('تم التسجيل. ابدأ الآن!');go('learn',{cid:c.id,lid:(c.lessons[0]||{}).id})}
    }
    if(ev.target.id==='cForm'){
      readForm();const e=S.edit;
      if(!e.titleAr){$('#f-tar').focus();toast('اكتب اسم الدورة');return}
      const body={titleAr:e.titleAr,titleEn:e.titleEn,track:e.track,level:e.level,price:e.price,order:e.order,descAr:e.descAr,published:e.published,lessons:e.lessons.map(l=>({id:l.id,titleAr:l.titleAr,minutes:+l.minutes||0,videoId:l.videoId||null,notes:l.notes||'',files:(l.files||[]).map(f=>({id:f.id,name:f.name,size:f.size||0,type:f.type||''}))})),updatedAt:Date.now()};
      if(e.sample)body.sample=true;
      await S.db.doc('courses/'+e.id).set(body);
      S.edit=null;toast('حُفظت الدورة');render();
    }
  }catch(e){toast('تعذّر الحفظ، حاول مرة أخرى.')}
});
app.addEventListener('change',async ev=>{
  const el=ev.target;
  if(el.dataset.lf!==undefined&&el.files.length){
    readForm();const i=+el.dataset.lf;const L=S.edit.lessons[i];L.files=L.files||[];const fs=[...el.files];
    L._upf=true;render();
    for(const f of fs){
      if(f.size>20*1024*1024){toast(f.name+': الحجم أكبر من 20MB');continue}
      try{const r=await S.assets.upload(f);L.files.push({id:r.id,name:f.name,size:f.size,type:f.type})}
      catch(e){toast(f.name+': '+(e&&e.code==='invalid_request'?'نوع الملف غير مدعوم. حوّله إلى PDF.':'تعذّر الرفع.'))}
    }
    L._upf=false;render();toast('رُفعت المواد. اضغط حفظ الدورة.');return;
  }
  if(el.dataset.lv===undefined||!el.files[0])return;
  readForm();const i=+el.dataset.lv;const f=el.files[0];
  if(f.size>20*1024*1024){toast('حجم الفيديو أكبر من 20MB. اضغطه وجرّب مرة أخرى.');return}
  S.edit.lessons[i]._up=true;render();
  try{const r=await S.assets.upload(f);S.edit.lessons[i].videoId=r.id;toast('رُفع الفيديو. اضغط حفظ الدورة.')}catch(e){toast('تعذّر رفع الفيديو.')}
  S.edit.lessons[i]._up=false;render();
});
$('#goHome').addEventListener('click',()=>go('catalog'));
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(b.dataset.go,{edit:null})});

/* ---------- BOOT ---------- */
render();
(async function boot(){
  const [db,user]=await Promise.all([window.claude?.use?.('db'),window.claude?.use?.('user')]).catch(()=>[null,null]);
  S.db=db;
  if(user){S.uid=await user.id();S.canEdit=await user.canEdit();const me=await user.me();S.name=me&&me.name||''}
  if(!db){S.offline=true;S.coursesLoaded=true;render();return}
  db.collection('courses').onSnapshot(s=>{S.courses=s.docs.map(x=>Object.assign({id:x.id},x.data()));S.coursesLoaded=true;if(!S.edit)render()},()=>{S.offline=true;render()});
  if(S.uid){
    db.doc('orders/'+S.uid).onSnapshot(s=>{S.myOrder=s.exists?s.data():null;if(!S.edit)render()},()=>{});
    db.collection('data/users/'+S.uid).onSnapshot(s=>{const m={};s.docs.forEach(x=>m[x.id]=x.data());S.progress=m;if(!S.edit)render()},()=>{});
  }
  if(S.canEdit)db.collection('orders').onSnapshot(s=>{S.orders=s.docs.map(x=>Object.assign({id:x.id},x.data()));if(S.view==='admin'&&!S.edit)render()},()=>{});
  render();
  const [assets,downloads]=await Promise.all([window.claude.use('assets'),window.claude.use('downloads')]).catch(()=>[null,null]);
  S.assets=assets;S.downloads=downloads;render();
})();
})();
</script>
