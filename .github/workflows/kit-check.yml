name: kit-check
on:
  push:
    paths: ['.github/workflows/kit-check.yml']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U='https://academy.marketingmiddleeast.com/gift/student-kit.pdf?t=1794322559.1.970d2b6d694f79d2a0bc80c6ac7d62b3a63b61700c0ba78c2205fd847e6d1ae7'
          for UA in "Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/130 Mobile Safari/537.36" "Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 Version/17.0 Mobile/15E148 Safari/604.1"; do
            echo "== $UA"; curl -sS -D - -o kit.bin -A "$UA" "$U" | head -20; file kit.bin; ls -l kit.bin; head -c 200 kit.bin | strings | head -5
          done
          echo "== range"; curl -sS -D - -o r.bin -H 'Range: bytes=0-1023' "$U" | head -15; ls -l r.bin
