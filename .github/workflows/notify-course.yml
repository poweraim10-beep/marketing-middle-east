name: Academy — announce a course to every account
on:
  push:
    branches: [main]
    paths: ['.github/workflows/notify-course.yml']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the site deploy
        run: sleep 150
      - name: Send «🆕 دورة جديدة» for funded-ads (site popup + bell + phone push)
        run: |
          T=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=mme-academy-transcode" | python3 -c 'import json,sys;print(json.load(sys.stdin)["value"])')
          curl -fsS -X POST -H "Authorization: Bearer $T" -H 'content-type: application/json' -d '{}' https://academy.marketingmiddleeast.com/api/tc/notify-course/funded-ads
